  # =========================================================
  # FLANGE PICK/PLACE — CONFIGURATION USED BY flange_pp.cpp
  # Keep the original environment/frame/object keys above unchanged.
  # =========================================================
  flange_pp:
    combined_group: robot3_robot4_arms
    # MoveIt group names and end-effector links are existing SRDF/URDF names.
    robot3:
      group: robot3_arm
      link: robot3_end_effactor_ff
      pick_frame: inventory_3a_4a_frame
      place_frame: place_frame_10_l
      arc_frames: [r3_arc_start, r3_arc_mid, r3_arc_end]
      object_id: rebar_3c
      inventory_id: inventory_3a_4a
      touch_links: [robot3_end_effactor_ff, robot3_J6_link, robot3_sa3_grpr01_r]
      pick_offset: [0.0, 0.0, 0.0]
      place_offset: [0.0, 0.0, 0.0]
    robot4:
      group: robot4_arm
      link: robot4_end_effactor_ff
      pick_frame: inventory_3a_4a_frame_2
      place_frame: place_frame_10
      arc_frames: [r4_arc_start, r4_arc_mid, r4_arc_end]
      object_id: rebar_4c
      inventory_id: inventory_3a_4a_2
      touch_links: [robot4_end_effactor_ff, robot4_J6_link, robot4_sa3_grpr01_r]
      pick_offset: [0.0, 0.0, 0.0]
      place_offset: [0.0, 0.0, 0.0]
    jig_object_id: jig_clamp
    # Three-point circular transfer is sampled into this many paired waypoints.
    arc_points: 8
    planning:
      planning_time: 15.0
      planning_attempts: 10
      retries: 3
      ik_timeout: 1.0
      movej_velocity: 0.10
      movej_acceleration: 0.10
      movel_velocity: 0.10
      movel_acceleration: 0.10

  # Each ordered step is executed ONLY after the previous step succeeded.
  # Paired moves: moveJ = one combined 12-joint OMPL plan; moveL = separate
  # Pilz LIN plans merged and executed as one combined 12-joint trajectory.
  # In each robot entry, reference = pick_frame | place_frame | arc_waypoint
  # | current_tcp. XYZ offsets use world/local axes; RPY offsets default to
  # local axes (rpy_frame: world is supported). All distances in metres;
  # all angles in radians. Arc starts, mids and ends come from arc_frames above.
  # before_actions and after_actions affect MoveIt collision/attachment state.
  # =========================================================
  # GANTRY + ROBOT 3 REBAR 1A PICK/PLACE
  # YAML is the motion program's single source of truth.  ROS launch
  # parameter overrides take precedence over ros_parameters defaults.
  # Gantry travel is controller joint-space motion, not MoveIt Cartesian LIN.
  # =========================================================
  gantry_move:
    ros_parameters:
      controller_action: /gantry_controller/follow_joint_trajectory
      horizontal_joint: gantry_slide_joint
      vertical_joint: gantry_down_joint
      rebar_object_id: rebar_1A
      attach_link: gantry_part_link
      move_group_name: robot3_arm
      horizontal_home_m: 0.0
      vertical_home_m: 0.0
      robot3_group: robot3_arm
      robot3_planning_link: robot3_end_effactor
      robot_rebar_object_id: rebar_1A
      robot3_pick_frame: bm_pkL
      robot3_place_frame: bm_pfl
      jig_clamp_name: jig_clamp
      rebar_allowed_contact_objects: []
      approach_height_m: 0.60
      place_approach_distance_m: 0.10
      pick_approach_dx_m: 0.0
      pick_approach_dz_m: 0.60
      horizontal_pick_target_m: 0.0
      vertical_pick_target_m: 4.1
      horizontal_target_m: -6.0
      down_target_m: 1.2
      speed_mps: 0.30
      acceleration_mps2: 0.50
      horizontal_min_m: -10.6
      horizontal_limit_m: 10.6
      vertical_limit_m: 6.6
      settle_time_sec: 0.5
      trajectory_timeout_sec: 60.0
      auto_start: true
      start_delay_sec: 3.0
      ready_timeout_sec: 90.0
    robot3_touch_links: [robot3_end_effactor, robot3_J6_link, robot3_sa3_grpr01]
    planning:
      planning_time: 15.0
      joint_movej_velocity: 0.50
      joint_movej_acceleration: 0.40
      cartesian_velocity: 0.15
      cartesian_acceleration: 0.10
      cartesian_max_translation_step_m: 0.01
      cartesian_max_rotation_step_rad: 0.03
      cartesian_eef_step_m: 0.01
      cartesian_min_fraction: 0.99
      pilz_velocity: 0.20
      pilz_acceleration: 0.10


