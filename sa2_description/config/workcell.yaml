  planner_sequence:

    # SA1-style ordered planner programs; actions after each completed step.
    shear_links_pp:
      stages:
      - id: P1
        description: pick approach
        reference: pick_approach
        motion: moveJ
        after_actions:
        - allow_pick_contact
      - id: P2
        description: pick
        reference: pick
        motion: moveL
        after_actions:
        - attach_rebar
        - allow_web_ring_contact
      - id: P3
        description: pick approach
        reference: pick_approach
        motion: moveL
        after_actions:
        - restore_pick_contact
      - id: T1
        description: place approach
        reference: place_approach
        motion: fallback
        after_actions:
        - allow_place_contact
      - id: G1
        description: place
        reference: place
        motion: moveL
        after_actions:
        - detach_rebar
      - id: G2
        description: place approach
        reference: place_approach
        motion: moveL
        after_actions:
        - restore_place_contact
        - complete_pair
      finish:
      - id: H1
        reference: home
        motion: moveJ
    tying_rebars:
      point:
      - id: T1
        reference: tie_approach
        motion: moveJ
      - id: T2
        reference: tie_frame
        motion: moveL
      - id: T3
        reference: tie_approach
        motion: moveL
        after_actions:
        - mark_point_complete
      finish:
      - id: H1
        reference: home
        motion: moveJ
    robot1_gripper_change:
      steps:
      - id: D1
        description: schunk_dock moveJ
        reference: schunk_dock
        motion: moveJ
        offset_frame: world
        xyz:
        - 0.0
        - 0.0
        - 0.5
        rpy:
        - 0.0
        - 0.0
        - 0.0
        after_actions: []
      - id: D2
        description: schunk_dock moveL
        reference: schunk_dock
        motion: moveL
        offset_frame: world
        xyz:
        - 0.0
        - 0.0
        - 0.0
        rpy:
        - 0.0
        - 0.0
        - 0.0
        after_actions:
        - detach_schunk
        - allow_schunk_contacts
      - id: D3
        description: schunk_dock moveL
        reference: schunk_dock
        motion: moveL
        offset_frame: world
        xyz:
        - 0.0
        - 0.0
        - 0.5
        rpy:
        - 0.0
        - 0.0
        - 0.0
        after_actions:
        - restore_schunk_contacts
        - allow_gun_contacts
      - id: D4
        description: gun_dock moveJ
        reference: gun_dock
        motion: moveJ
        offset_frame: world
        xyz:
        - 0.0
        - 0.0
        - 0.5
        rpy:
        - 0.0
        - 0.0
        - 0.0
        after_actions: []
      - id: D5
        description: gun_dock moveL
        reference: gun_dock
        motion: moveL
        offset_frame: world
        xyz:
        - 0.0
        - 0.0
        - 0.0
        rpy:
        - 0.0
        - 0.0
        - 0.0
        after_actions:
        - attach_tying_gun
      - id: D6
        description: gun_dock moveL
        reference: gun_dock
        motion: moveL
        offset_frame: world
        xyz:
        - 0.0
        - 0.0
        - 0.5
        rpy:
        - 0.0
        - 0.0
        - 0.0
        after_actions:
        - restore_gun_contacts

    # Gantry uses joint action goals; Robot 3 uses MoveIt MoveL/MoveJ.
    # Actions are executed before/after the indicated motion and fail closed.
    # The gantry cannot lift until Robot 3 has attached AND retracted.
    # Horizontal gantry return overlaps Robot 3 pre-place/insert/retract only.
    gantry_move:
      gantry:
        - id: G1
          description: raised gantry moves horizontally to rebar pickup
          motion: joint
          joint: horizontal
          reference: pick
        - id: G2
          description: gantry lowers to pickup and attaches rebar
          motion: joint
          joint: vertical
          reference: pick
          after_actions: [settle, attach_gantry, settle]
        - id: G3
          description: gantry raises with rebar before horizontal transport
          motion: joint
          joint: vertical
          reference: home
        - id: G4
          description: gantry transports rebar horizontally to handoff
          motion: joint
          joint: horizontal
          reference: handoff
        - id: G5
          description: gantry lowers for handoff and releases rebar
          motion: joint
          joint: vertical
          reference: handoff
          after_actions: [settle, detach_gantry]
      robot3:
        - id: R1
          description: robot3 collision-checked side approach (priority ordered)
          reference: pick_frame
          motion: moveL
          planner: cartesian
          offset_frame: world
          xyz: [0.0, 0.0, 0.0]
          rpy: [0.0, 0.0, 0.0]
          before_actions: [prepare_robot3_pick]
          # Side approaches preserve the existing ordering: world then local,
          # 30 cm candidates before 50 cm candidates within each frame.
          candidates:
            - {offset_frame: world, xyz: [-0.30,  0.00, 0.00]}
            - {offset_frame: world, xyz: [ 0.30,  0.00, 0.00]}
            - {offset_frame: world, xyz: [ 0.00, -0.30, 0.00]}
            - {offset_frame: world, xyz: [ 0.00,  0.30, 0.00]}
            - {offset_frame: world, xyz: [-0.50,  0.00, 0.00]}
            - {offset_frame: world, xyz: [ 0.50,  0.00, 0.00]}
            - {offset_frame: world, xyz: [ 0.00, -0.50, 0.00]}
            - {offset_frame: world, xyz: [ 0.00,  0.50, 0.00]}
            - {offset_frame: local, xyz: [-0.30,  0.00, 0.00]}
            - {offset_frame: local, xyz: [ 0.30,  0.00, 0.00]}
            - {offset_frame: local, xyz: [ 0.00, -0.30, 0.00]}
            - {offset_frame: local, xyz: [ 0.00,  0.30, 0.00]}
            - {offset_frame: local, xyz: [-0.50,  0.00, 0.00]}
            - {offset_frame: local, xyz: [ 0.50,  0.00, 0.00]}
            - {offset_frame: local, xyz: [ 0.00, -0.50, 0.00]}
            - {offset_frame: local, xyz: [ 0.00,  0.50, 0.00]}
        - id: R2
          description: straight Pilz LIN to Robot3 pick frame and attach
          reference: pick_frame
          motion: moveL
          planner: pilz
          offset_frame: world
          xyz: [0.0, 0.0, 0.0]
          rpy: [0.0, 0.0, 0.0]
          after_actions: [attach_robot3]
        - id: R3
          description: 10 cm local negative X post-pick retract, THEN raise gantry
          reference: pick_frame
          motion: moveL
          planner: cartesian
          offset_frame: local
          xyz: [-0.10, 0.0, 0.0]
          rpy: [0.0, 0.0, 0.0]
          ik_check: true
          after_actions: [lift_gantry_start_parallel_return]
        - id: R4
          description: direct continuous Cartesian MoveL to pre-place
          reference: place_frame
          motion: moveL
          planner: cartesian
          offset_frame: local
          xyz: [-0.10, 0.0, 0.0]
          rpy: [0.0, 0.0, 0.0]
          ik_check: true
          before_actions: [allow_jig_contact]
        - id: R5
          description: final straight Cartesian insertion and detach to world
          reference: place_frame
          motion: moveL
          planner: cartesian
          offset_frame: world
          xyz: [0.0, 0.0, 0.0]
          rpy: [0.0, 0.0, 0.0]
          after_actions: [detach_robot3]
        - id: R6
          description: sideways local positive Y retract
          reference: place_frame
          motion: moveL
          planner: cartesian
          offset_frame: local
          xyz: [0.0, 0.10, 0.0]
          rpy: [0.0, 0.0, 0.0]
          ik_check: true
          after_actions: [wait_gantry_parallel_return]
        - id: R7
          description: Robot3 returns to captured startup joint state
          reference: home
          motion: moveJ

    flange_pp:
      pick:
        - id: P1
          description: both robots pick approach
          motion: moveJ
          robot3: {reference: pick_frame, offset_frame: world, xyz: [-0.600, 0.0, 0.600], rpy: [0.0, 0.0, 0.0]}
          robot4: {reference: pick_frame, offset_frame: world, xyz: [ 0.600, 0.0, 0.600], rpy: [0.0, 0.0, 0.0]}

        - id: P2
          description: synchronized linear pick
          motion: moveL
          before_actions: [prepare_pick]
          after_actions: [attach_objects, allow_inventory_contact]
          robot3: {reference: pick_frame, offset_frame: world, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
          robot4: {reference: pick_frame, offset_frame: world, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}

        - id: P3
          description: synchronized pick retract
          motion: moveL
          after_actions: [restore_inventory_contact]
          robot3: {reference: pick_frame, offset_frame: world, xyz: [-0.600, 0.0, 0.600], rpy: [0.0, 0.0, 0.0]}
          robot4: {reference: pick_frame, offset_frame: world, xyz: [ 0.600, 0.0, 0.600], rpy: [0.0, 0.0, 0.0]}

      transfer:
        - id: T1
          description: synchronized circular transfer (all arc waypoints)
          motion: moveL
          repeat: arc_waypoints
          robot3: {reference: arc_waypoint, offset_frame: world, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
          robot4: {reference: arc_waypoint, offset_frame: world, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}

      place:
        - id: G1
          description: synchronized place approach
          motion: moveL
          before_actions: [allow_place_contact]
          robot3: {reference: place_frame, offset_frame: world, xyz: [0.0, -0.250, 0.0], rpy: [0.0, 0.0, 0.0]}
          robot4: {reference: place_frame, offset_frame: world, xyz: [0.0, -0.250, 0.0], rpy: [0.0, 0.0, 0.0]}

        - id: G2
          description: synchronized exact place
          motion: moveL
          after_actions: [detach_objects]
          robot3: {reference: place_frame, offset_frame: world, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
          robot4: {reference: place_frame, offset_frame: world, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}

        - id: G3
          description: synchronized place retract
          motion: moveL
          after_actions: [restore_gripper_contact]
          robot3: {reference: place_frame, offset_frame: world, xyz: [0.0, -0.250, 0.0], rpy: [0.0, 0.0, 0.0]}
          robot4: {reference: place_frame, offset_frame: world, xyz: [0.0, -0.250, 0.0], rpy: [0.0, 0.0, 0.0]}

      finish:
        - id: H1
          description: combined home
          motion: moveJ
          reference: home

