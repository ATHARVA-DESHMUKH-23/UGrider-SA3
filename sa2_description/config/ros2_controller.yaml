controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    robot1_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robot2_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robot3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robot4_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gantry_controller:
      type: joint_trajectory_controller/JointTrajectoryController

robot1_arm_controller:
  ros__parameters:
    joints:
      - robot1_J1
      - robot1_J2
      - robot1_J3
      - robot1_J4
      - robot1_J5
      - robot1_J6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    set_last_command_interface_value_as_state_on_activation: false
    state_publish_rate: 125.0
    action_monitor_rate: 20.0
    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 0.01
      robot1_J1: {goal: 0.01}
      robot1_J2: {goal: 0.01}
      robot1_J3: {goal: 0.01}
      robot1_J4: {goal: 0.01}
      robot1_J5: {goal: 0.01}
      robot1_J6: {goal: 0.01}

