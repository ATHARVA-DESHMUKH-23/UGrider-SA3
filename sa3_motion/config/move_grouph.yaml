/**:
  ros__parameters:
    default_planning_pipeline: ompl
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
    moveit_manage_controllers: true
    moveit_simple_controller_manager:
      controller_names:
      - robot1_arm_controller
      - robot2_arm_controller
      - robot3_arm_controller
      - robot4_arm_controller
      robot1_arm_controller:
        action_ns: follow_joint_trajectory
        default: true
        joints:
        - robot1_J1
        - robot1_J2
        - robot1_J3
        - robot1_J4
        - robot1_J5
        - robot1_J6
        type: FollowJointTrajectory
      robot2_arm_controller:
        action_ns: follow_joint_trajectory
        default: true
        joints:
        - robot2_J1
        - robot2_J2
        - robot2_J3
        - robot2_J4
        - robot2_J5
        - robot2_J6
        type: FollowJointTrajectory
      robot3_arm_controller:
        action_ns: follow_joint_trajectory
        default: true
        joints:
        - robot3_J1
        - robot3_J2
        - robot3_J3
        - robot3_J4
        - robot3_J5
        - robot3_J6
        type: FollowJointTrajectory
      robot4_arm_controller:
        action_ns: follow_joint_trajectory
        default: true
        joints:
        - robot4_J1
        - robot4_J2
        - robot4_J3
        - robot4_J4
        - robot4_J5
        - robot4_J6
        type: FollowJointTrajectory
    ompl:
      jiggle_fraction: 0.05
      planner_configs:
        AnytimePathShortening:
          hybridize: 1
          max_hybrid_paths: 24
          num_planners: 4
          planners: ''
          shortcut: 1
          type: geometric::AnytimePathShortening
        BFMT:
          balanced: 0
          cache_cc: 1
          extended_fmt: 1
          heuristics: 1
          nearest_k: 1
          num_samples: 1000
          optimality: 1
          radius_multiplier: 1.0
          type: geometric::BFMT
        BKPIECE:
          border_fraction: 0.9
          failed_expansion_score_factor: 0.5
          min_valid_path_fraction: 0.5
          range: 0.0
          type: geometric::BKPIECE
        BiEST:
          range: 0.0
          type: geometric::BiEST
        BiTRRT:
          cost_threshold: 1.0e+300
          frountier_node_ratio: 0.1
          frountier_threshold: 0.0
          init_temperature: 100
          range: 0.0
          temp_change_factor: 0.1
          type: geometric::BiTRRT
        EST:
          goal_bias: 0.05
          range: 0.0
          type: geometric::EST
        FMT:
          cache_cc: 1
          extended_fmt: 1
          heuristics: 0
          nearest_k: 1
          num_samples: 1000
          radius_multiplier: 1.1
          type: geometric::FMT
        KPIECE:
          border_fraction: 0.9
          failed_expansion_score_factor: 0.5
          goal_bias: 0.05
          min_valid_path_fraction: 0.5
          range: 0.0
          type: geometric::KPIECE
        LBKPIECE:
          border_fraction: 0.9
          min_valid_path_fraction: 0.5
          range: 0.0
          type: geometric::LBKPIECE
        LBTRRT:
          epsilon: 0.4
          goal_bias: 0.05
          range: 0.0
          type: geometric::LBTRRT
        LazyPRM:
          range: 0.0
          type: geometric::LazyPRM
        LazyPRMstar:
          type: geometric::LazyPRMstar
        PDST:
          type: geometric::PDST
        PRM:
          max_nearest_neighbors: 10
          type: geometric::PRM
        PRMstar:
          type: geometric::PRMstar
        ProjEST:
          goal_bias: 0.05
          range: 0.0
          type: geometric::ProjEST
        RRT:
          goal_bias: 0.05
          range: 0.0
          type: geometric::RRT
        RRTConnect:
          range: 0.0
          type: geometric::RRTConnect
        RRTstar:
          delay_collision_checking: 1
          goal_bias: 0.05
          range: 0.0
          type: geometric::RRTstar
        SBL:
          range: 0.0
          type: geometric::SBL
        SPARS:
          dense_delta_fraction: 0.001
          max_failures: 1000
          sparse_delta_fraction: 0.25
          stretch_factor: 3.0
          type: geometric::SPARS
        SPARStwo:
          dense_delta_fraction: 0.001
          max_failures: 5000
          sparse_delta_fraction: 0.25
          stretch_factor: 3.0
          type: geometric::SPARStwo
        STRIDE:
          degree: 16
          estimated_dimension: 0.0
          goal_bias: 0.05
          max_degree: 18
          max_pts_per_leaf: 6
          min_degree: 12
          min_valid_path_fraction: 0.2
          range: 0.0
          type: geometric::STRIDE
          use_projected_distance: 0
        TRRT:
          frountierNodeRatio: 0.1
          frountier_threshold: 0.0
          goal_bias: 0.05
          init_temperature: 1.0e-05
          k_constant: 0.0
          max_states_failed: 10
          min_temperature: 1.0e-09
          range: 0.0
          temp_change_factor: 2.0
          type: geometric::TRRT
      planning_plugin: ompl_interface/OMPLPlanner
      request_adapters: default_planner_request_adapters/AddTimeOptimalParameterization
        default_planner_request_adapters/ResolveConstraintFrames default_planner_request_adapters/FixWorkspaceBounds
        default_planner_request_adapters/FixStartStateBounds default_planner_request_adapters/FixStartStateCollision
        default_planner_request_adapters/FixStartStatePathConstraints
      start_state_max_bounds_error: 0.1
    pilz_industrial_motion_planner:
      capabilities: pilz_industrial_motion_planner/MoveGroupSequenceAction pilz_industrial_motion_planner/MoveGroupSequenceService
      default_planner_config: PTP
      planning_plugin: pilz_industrial_motion_planner/CommandPlanner
      request_adapters: ''
    planning_pipelines:
    - ompl
    - pilz_industrial_motion_planner
    publish_geometry_updates: true
    publish_planning_scene: true
    publish_robot_description: false
    publish_robot_description_semantic: false
    publish_state_updates: true
    publish_transforms_updates: true
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
