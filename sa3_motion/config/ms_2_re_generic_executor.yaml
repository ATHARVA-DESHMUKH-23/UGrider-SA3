# SA3 full sequence — consolidated reviewed ACM contract (simulation only)
motion_sequence:
  schema_version: 3
  workcell:
    package: sa2_description
    file: config/workcell.yaml
    world_frame: world
  defaults:
    executor: sa3_generic_executor
    target:
      offset_frame: world
      rpy_frame: local
    planning:
      fallback_only_before_execution: true
      reject_unknown_planner: true
      # Global pre-execution collision-validation replans for all motion() tasks,
      # including D1 gripper change. Initial plan + 2 new plans; never replay execution.
      collision_validation_max_attempts: 3
      collision_validation_retry_delay_sec: 0.25
      # A slow full-scene service response is NOT an accepted motion state.
      # Wait longer for a response while other parallel SA3 tasks are active.
      state_validity_response_timeout_sec: 20.0
    execution:
      verify_completed_motion: true
      if_execution_uncertain: stop_and_reconcile
      simulation_only_until_validated: true
    collision_validation_group: sa3_all_robots
    # Global planning-scene synchronization for every attach/detach operation.
    # Shear also checks after G2 and before next P1.
    # This verifies the canonical MoveIt scene; it cannot guarantee RViz rendering latency.
    scene_sync:
      attach_timeout_sec: 8.0
      detach_timeout_sec: 8.0
      poll_interval_sec: 0.15
      stable_polls: 3
      world_position_tolerance_m: 0.01
      world_orientation_tolerance_rad: 0.05
    scene_objects:
      jig_clamp: jig_clamp
      main_jig: sa3_main_jig
    acm:
      lock_file: /tmp/sa3_generic_executor_acm.lock
      update_attempts: 4
      verification_polls: 5
      poll_interval_sec: 0.1
      get_read_attempts: 3
      get_response_timeout_sec: 20.0
      get_retry_delay_sec: 1.0
  safety:
    require_verified_scene_actions: true
    require_exclusive_robot_motion_ownership: true
    reject_unvalidated_parallel_interference: true
    validate_inter_robot_paths: true
    abort_on_checkpoint_failure: true
    restore_temporary_acm_permissions: true
    restart_requires_live_state_reconciliation: true
  reporting:
    enabled: true
    formats:
    - csv
    output_directory: logs/sa3_runs
    clock: steady_wall
    record_failed_attempts: true
    record_fields:
    - run_id
    - phase
    - task
    - robot
    - object_id
    - pair_index
    - point_id
    - step_id
    - motion
    - planner
    - velocity_scale
    - attempt
    - planning_seconds
    - validation_seconds
    - execution_seconds
    - scene_seconds
    - elapsed_seconds
    - status
    - error_code
    summary_at_end: true
  checkpoints:
    gantry_g4:
      owner_task: gantry_bottom_mat_2_re
      after_step: G4
      status_service: /gantry_checkpoint_status
      success_contains: G4_HOLD_VERIFIED
      resume_service: /resume_gantry_motion
      timeout_sec: 240.0
      position_tolerance_m: 0.01
    robot3_r3:
      owner_task: gantry_bottom_mat_2_re
      after_step: R3
      status_service: /gantry_robot3_pick_checkpoint_status
      success_contains: R3_HOLD_VERIFIED
      resume_service: /resume_robot3_place
      timeout_sec: 240.0
      object_id: rebar_1A
  action_types:
    motion:
    - moveJ
    - moveL
    - moveC
    - movePTP
    - joint
    - named_state
    - fallback
    scene:
    - attach
    - attach_at_dock
    - detach
    - acm_allow
    - acm_restore
    - settle
    sync:
    - wait_checkpoint
    - resume_checkpoint
    - wait_all_completions
    - verify_named_state
    - wait_completion_notifications
  stages:
  - id: initialize_tools
    name: Initialize Schunk gripper attachments
    mode: sequential
    executables:
    - name: sa3_generic_executor
      parameters:
        motion_task: initialize_schunk_grippers
    retries: 1
    on_failure: abort
  - id: phase1
    name: PHASE 1 - flange 3C 4C overlaps gantry transport to G4
    mode: overlap
    executables:
    - name: sa3_generic_executor
      background: true
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_task: gantry_bottom_mat_2_re
        pause_after_g4: true
        pause_after_r3: true
        checkpoint_tolerance_m: 0.01
    - name: sa3_generic_executor
      background: false
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_task: flange_3c_4c
        skip_home: true
    retries: 1
    on_failure: abort
  - id: phase2
    name: PHASE 2 - reverse Pilz PTP and flange 3D 4D without home
    mode: sequential
    executables:
    - name: sa3_generic_executor
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_task: flange_3d_4d
        skip_home: true
        wait_for_gantry_g4: true
        gantry_checkpoint_timeout_sec: 180.0
    retries: 1
    on_failure: abort
  - id: phase3a
    name: PHASE 3A - combined 24 joint flange home plus shear first P1
    mode: combined
    combined_step: flange_home_with_shear_P1
    execute_motion: true
    retries: 1
    on_failure: abort
  - id: phase4
    name: PHASE 4 - complete shear links from verified P1
    mode: sequential
    executables:
    - name: sa3_generic_executor
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_task: shear_links_2_re
        first_p1_prepositioned: true
    retries: 1
    on_failure: abort
  - id: phase5
    name: PHASE 5 - Robot3+4 pick place and Robot1+2 gripper change concurrently
    mode: parallel
    executables:
    - name: sa3_generic_executor
      parameters:
        motion_task: phase3_phase5_parallel
        workflow_mode: phase3_phase5_parallel
        execute_motion: true
        require_robot4_already_home: true
        phase3_combined_group: robot3_robot4_arms
        phase3_collision_group: sa3_all_robots
        robot3_group: robot3_arm
        robot4_group: robot4_arm
        phase3_checkpoint_timeout_sec: 240.0
        phase5_timeout_sec: 1800.0
        phase5_checkpoint_timeout_sec: 240.0
    - name: sa3_generic_executor
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_task: change_to_tying_guns
        wait_for_gantry_g5: true
        gantry_g5_wait_timeout_sec: 240.0
    retries: 1
    on_failure: abort
    marks_background_completion_phase: true
  - id: phase6a
    name: PHASE 6A - tying_2_re
    mode: sequential
    executables:
    - name: sa3_generic_executor
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_task: tying_2_re
    retries: 1
    on_failure: abort
  - id: phase6b
    name: PHASE 6B - tying_bottom_mat_2_re
    mode: sequential
    executables:
    - name: sa3_generic_executor
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_task: tying_bottom_mat_2_re
    retries: 1
    on_failure: abort
  - id: phase6c
    name: PHASE 6C - Pick/place final assembly
    mode: sequential
    executables:
    - name: sa3_generic_executor
      parameters:
        motion_task: final_assembly
    retries: 1
    on_failure: abort
  combined_motions:
    flange_home_with_shear_P1:
      group: sa3_all_robots
      planner_id: RRTConnectkConfigDefault
      velocity_scale: 0.45
      acceleration_scale: 0.4
      planning_time: 30.0
      planning_attempts: 12
      ik_timeout: 2.0
      validation_joint_step_rad: 0.05
      operations:
      - task: flange_3d_4d
        step: H1
      - task: shear_links_2_re
        step: P1
        pair_index: 0
      goals:
      - robot: robot3
        named_state: home
      - robot: robot4
        named_state: home
      - robot: robot1
        target:
          reference: 5pf
          offset_frame: world
          xyz: &id001
          - 0.0
          - -0.25
          - 0.0
          rpy:
          - 0
          - 0
          - 0
      - robot: robot2
        target:
          reference: 6pf
          offset_frame: world
          xyz: *id001
          rpy:
          - 0
          - 0
          - 0
  tasks:
    flange_3c_4c:
      type: program
      execution:
        robots:
        - robot3
        - robot4
        combined_group: robot3_robot4_arms
        joint_strategy: combined_group
        linear_strategy: merged
        merge_time_axis: union_with_slow_arm_stretched
        planner_ownership: per_arm_lin
      robot3:
        pick_frame: 3c
        place_frame: place_frame_10_l
        object_id: rebar_3c
        inventory_id: inventory_3a_4a
        pick_offset:
        - 0.0
        - 0.0
        - 0.0
        pick_offset_frame: local
        pick_offset_rpy:
        - 0.627
        - -1.57
        - 0.627
        pick_offset_rpy_frame: local
        place_offset:
        - 0.0
        - 0.01
        - 0.0
        place_offset_rpy:
        - 0.0
        - 0.0
        - 0.0
        arc_frames:
        - r3_arc_start
        - r3_arc_mid
        - r3_arc_end
      robot4:
