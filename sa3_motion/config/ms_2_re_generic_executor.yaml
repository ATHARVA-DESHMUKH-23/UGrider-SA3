    change_to_tying_guns:
      type: program
      execution:
        robots:
        - robot1
        - robot2
        combined_group: sa3_robots_1_2
        strategy: merged
        preserve_existing_controller_backend: true
        require_tool_lock_feedback_on_real_hardware: true
        backend: follow_joint_trajectory
      config:
        execution:
          executer: follow_joint_trajectory
          robot1_action: /robot1_arm_controller/follow_joint_trajectory
          robot2_action: /robot2_arm_controller/follow_joint_trajectory
          start_delay_sec: 0.5
          result_timeout_margin_sec: 30.0
          start_tolerance_rad: 0.05
        planning:
          planning_time: 15.0
          movej_plan_retries: 3
          ompl_attempts: 10
          ik_timeout: 1.0
          movej_velocity: 0.5
          movej_acceleration: 0.5
          movel_velocity: 0.45
          movel_acceleration: 0.45
          # Replan Pilz LIN before rejecting D5: does not execute between attempts.
          linear_plan_retries: 3
          linear_plan_retry_delay_sec: 0.25
      steps:
      - id: D1
        description: approach source dock
        reference: source_dock
        motion: moveJ
        offset_frame: world
        xyz: &id016
        - 0
        - 0
        - 0.5
        rpy: &id017
        - 0
        - 0
        - 0
        after_actions: []
      - id: D2
        description: dock and detach source tool
        reference: source_dock
        motion: moveL
        offset_frame: world
        xyz: &id018
        - 0
        - 0
        - 0
        rpy: &id019
        - 0
        - 0
        - 0
        after_actions:
        - detach_source
        - allow_source_contacts
      - id: D3
        description: retract from source dock
        reference: source_dock
        motion: moveL
        offset_frame: world
        xyz: &id020
        - 0
        - 0
        - 0.5
        rpy: &id021
        - 0
        - 0
        - 0
        after_actions:
        - restore_source_contacts
        - allow_target_contacts
      - id: D4
        description: approach target dock
        reference: target_dock
        motion: moveJ
        offset_frame: world
        xyz: &id024
        - 0
        - 0
        - 0.5
        rpy: &id025
        - 0
        - 0
        - 0
        after_actions: []
      - id: D5
        description: dock and attach target tool
        reference: target_dock
        motion: moveL
        offset_frame: world
        xyz: &id026
        - 0
        - 0
        - 0
        rpy: &id027
        - 0
        - 0
        - 0
        after_actions:
        - attach_target
      - id: D6
        description: retract with target tool
        reference: target_dock
        motion: moveL
        offset_frame: world
        xyz: &id028
        - 0
        - 0
        - 0.5
        rpy: &id029
        - 0
        - 0
        - 0
        after_actions:
        - restore_target_contacts
      source_tool: schunk
      target_tool: tying_gun
      completion_owner: robot12
      program:
      - op: wait_service
        id: WAIT_G5
        service: /gantry_g5_complete_status
        success_contains: G5_COMPLETE
        timeout_sec: 240.0
        only_if_param: wait_for_gantry_g5
        timeout_param: gantry_g5_wait_timeout_sec
      - op: move
        id: D1
        description: approach source dock
        motion: moveJ
        strategy: combined_group
        fallback_motions:
        - moveJ_pose_merged
        group: sa3_robots_1_2
        goals:
        - robot: robot1
          link: robot1_tool_mount
          target:
            reference: robot1_shuck_dock
            offset_frame: world
            xyz: *id016
            rpy: *id017
        - robot: robot2
          link: robot2_tool_mount
          target:
            reference: robot2_shuck_dock
            offset_frame: world
            xyz: *id016
            rpy: *id017
      - op: move
        id: D2
        description: dock and detach source tool
        motion: moveL
        strategy: merged
        group: sa3_robots_1_2
        goals:
        - robot: robot1
          link: robot1_tool_mount
          target:
            reference: robot1_shuck_dock
            offset_frame: world
            xyz: *id018
            rpy: *id019
        - robot: robot2
          link: robot2_tool_mount
          target:
            reference: robot2_shuck_dock
            offset_frame: world
            xyz: *id018
            rpy: *id019
      - op: detach
        id: D2_robot1_detach_source
        robot: robot1
        object: robot1_schunk_base
        link: robot1_tool_mount
      - op: detach
        id: D2_robot2_detach_source
        robot: robot2
        object: robot2_schunk_base
        link: robot2_tool_mount
      - op: acm
        id: D2_robot1_allow_source_contacts
        object: robot1_schunk_base
        with: &id022
        - robot1_tool_mount
        - robot1_J4_link
        - robot1_J5_link
        - robot1_J6_link
        allow: true
      - op: acm
        id: D2_robot2_allow_source_contacts
        object: robot2_schunk_base
        with: &id023
        - robot2_tool_mount
        - robot2_J4_link
        - robot2_J5_link
        - robot2_J6_link
        allow: true
      - op: move
        id: D3
        description: retract from source dock
        motion: moveL
        strategy: merged
        group: sa3_robots_1_2
        goals:
        - robot: robot1
          link: robot1_tool_mount
          target:
            reference: robot1_shuck_dock
            offset_frame: world
            xyz: *id020
            rpy: *id021
        - robot: robot2
          link: robot2_tool_mount
          target:
            reference: robot2_shuck_dock
            offset_frame: world
            xyz: *id020
            rpy: *id021
      - op: acm
        id: D3_robot1_restore_source_contacts
        object: robot1_schunk_base
        with: *id022
        allow: false
      - op: acm
        id: D3_robot2_restore_source_contacts
        object: robot2_schunk_base
        with: *id023
        allow: false
      - op: acm
        id: D3_robot1_allow_target_contacts
        object: robot1_tying_gun
        with: *id022
        allow: true
      - op: acm
        id: D3_robot2_allow_target_contacts
        object: robot2_tying_gun
        with: *id023
        allow: true
      - op: move
        id: D4
        description: approach target dock
        motion: moveJ
        strategy: combined_group
        group: sa3_robots_1_2
        goals:
        - robot: robot1
          link: robot1_tool_mount
          target:
            reference: robot1_tyinggun_dock
            offset_frame: world
            xyz: *id024
            rpy: *id025
        - robot: robot2
          link: robot2_tool_mount
          target:
            reference: robot2_tyinggun_dock
            offset_frame: world
            xyz: *id024
            rpy: *id025
      # SIMULATION ONLY. D4 has both tools at +0.50m in world Z above the dock.
      # Move ONLY Robot2 to +0.12m above its dock via a collision-checked
      # OMPL joint-space approach. Robot1 remains motionless at its D4 pose.
      # This pre-dock position has not been proven collision-free.
      # D5 then uses the existing LIN docking attempt with full-state checks.
      - op: move
        id: D4B_ROBOT2_PREDOCK
        description: robot2-only pre-dock approach, 0.12m above tying gun dock
        motion: moveJ
        strategy: single
        group: robot2_arm
        goals:
        - robot: robot2
          link: robot2_tool_mount
          target:
            reference: robot2_tyinggun_dock
            offset_frame: world
            xyz: [0.0, 0.0, 0.12]
            rpy: [0.0, 0.0, 0.0]
      - op: move
        id: D5
        description: dock and attach target tool
        motion: moveL
        strategy: merged
        group: sa3_robots_1_2
        # When Pilz LIN rejects one arm (e.g. robot2 -2), keep Cartesian
        # docking geometry via shared-state IK sampling, then validate the
        # entire workcell trajectory. Never use unrestricted MoveJ here.
