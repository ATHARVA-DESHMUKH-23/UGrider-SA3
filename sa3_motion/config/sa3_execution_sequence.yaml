# =============================================================================
# SA3 ROBOT ASSEMBLY — SEQUENCE + ACTION LIBRARY
# =============================================================================
# HOW TO READ THIS FILE (OUTSIDE -> INSIDE):
#
#   1. SEQUENCE  -> sa3_sequence.stages
#      Defines the ORDER of work (and whether stages run sequentially/parallel).
#      Each stage calls one or more reusable actions by name.
#
#   2. ACTION    -> sa3_sequence.stages[].actions[].action
#      Calls a definition under action_library.actions.<action_name>.
#      The 'with:' block supplies task-specific frame/object/offset parameters.
#      'defaults:' in the action definition supplies values not overridden by 'with:'.
#
#   3. STEP      -> action_library.actions.<action_name>.steps[]
#      The executor processes each step in order. 'id:' is the local step label;
#      'op:' selects WHAT kind of operation is performed. A move step can have
#      'before:' and 'after:' operations (for attachments or collision changes).
#
#   4. MOTION NODE / PLANNER -> op: move, motion:, strategy:, goals:
#      The generic C++ executor is the ROS node that runs each action.
#      The 'motion:' property selects MoveIt planning: moveJ (joint/OMPL),
#      moveL (linear/Pilz LIN), movePTP (Pilz PTP), moveC (Pilz CIRC).
#      'strategy: separate_merge' plans arms separately and merges their paths;
#      'strategy: combined' plans the combined MoveIt group.
#      'goals:' sets robot, planning link, reference frame and offsets.
#
# EXAMPLE FLOW:
#   Sequence stage "Shear links ..."  ->  action: shear_pair
#   -> action_library.actions.shear_pair.steps[P1] -> op: move
#   -> motion: moveL -> generic C++ executor -> MoveIt motion planning/execution.
#
# YAML NOTATION:
#   '{{pick_a}}' is a parameter expanded by the action executor.
#   xyz: [0, -0.25, 0] is a 3D offset; rpy: [0, 0, 0] is orientation offset.
#   &robot1_robot2_participants defines a YAML anchor; *robot1_robot2_participants
#   reuses the same list. Anchors are not robots or executor step IDs.
#   A leading '#' comments out that line, so it is NOT executed.
#
# OPERATIONS:
#   move          Plan and execute arm motion (motion/strategy/goals).
#   attach        Attach an existing scene object to a robot/tool link.
#   detach        Detach a scene object from its attached link.
#   acm_allow     Temporarily permit only the specified collision pairs.
#   acm_restore   Restore collision checking for specified collision pairs.
#   gantry_send   Send gantry x/z motion. Uses the step 'id:' only in this YAML.
#
# GANTRY POLICY IN THIS FILE:
#   All gantry sends are sequential: wait for completion before next step.
#   No 'request_id' or 'gantry_wait' is needed in this synchronous workflow.
#   Executor must default missing wait=true and must accept/generate a request
#   key from step id. Ensure the installed C++ implements those defaults.
#   Set a bounded executor default timeout (e.g. 120s), rather than no limit.
#   NOTE: this changes the former G6_raise async overlap to synchronous.
#
# COLLISION VALIDATION:
#   The current full_cell_collision_check value is preserved from the input.
#   'false' skips SA3's extra full-cell pass; MoveIt collision handling remains.
#   Use full-cell checking when validating paths, especially multi-arm paths.
# =============================================================================

# PART A: ORCHESTRATION — stages and their action calls
sa3_sequence:
  schema_version: 1
  default_action_library: sa3_execution_sequence.yaml
  # Each stage calls actions from PART B; mode sequential runs in order;
  # mode parallel runs listed actions concurrently (check workspace clearance).
  stages:
  - name: Initialize attached Schunk tools
    mode: sequential
    actions:
    - action: initialize_schunk_grippers
      with: {}
 
  - name: Gantry transfer and flange 3C/4C
    mode: parallel
    verified_non_interference: true
    actions:
    - action: gantry_pick_transfer
      with:
        rebar: rebar_1A
        gantry_pick_z: 4.1
        gantry_transport_x: -6.0
    - action: flange_pp
      with:
        approach_a: inventory_3a_4a_frame
        approach_b: inventory_3a_4a_frame_2
        transfer_start_a: r3_ptp_start
        transfer_start_b: r4_ptp_start
        transfer_end_a: r3_ptp_end
        transfer_end_b: r4_ptp_end
        place_a: place_frame_10_l
        place_b: place_frame_10
        do_home: false
        pick_a: 3c
        pick_b: 4c
        object_a: rebar_3c
        object_b: rebar_4c
        pick_a_rpy:
        - 0.627
        - -1.57
        - 0.627
        pick_b_rpy:
        - 0.943
        - -1.57
        - 0.943
        place_a_offset:
        - 0
        - 0.01
        - 0
        place_b_offset:
        - 0
        - 0.01
        - 0
  
  # - name: Reverse transfer and flange 3D/4D
  #   mode: sequential
  #   actions:
  #   - action: flange_reverse_pp
  #     with:
  #       approach_a: inventory_3a_4a_frame
  #       approach_b: inventory_3a_4a_frame_2
  #       transfer_start_a: r3_ptp_start
  #       transfer_start_b: r4_ptp_start
  #       transfer_end_a: r3_ptp_end
  #       transfer_end_b: r4_ptp_end
  #   - action: flange_pp
  #     with:
  #       approach_a: inventory_3a_4a_frame
  #       approach_b: inventory_3a_4a_frame_2
  #       transfer_start_a: r3_ptp_start
  #       transfer_start_b: r4_ptp_start
  #       transfer_end_a: r3_ptp_end
  #       transfer_end_b: r4_ptp_end
  #       place_a: place_frame_10_l
  #       place_b: place_frame_10
  #       do_home: false
  #       pick_a: 3d
  #       pick_b: 4d
  #       object_a: rebar_3d
  #       object_b: rebar_4d
  #       pick_a_offset:
  #       - 0.127
  #       - -0.045
  #       - 0.008
  #       pick_b_offset:
  #       - -0.155
  #       - -0.057
  #       - -0.01
  #       pick_a_rpy:
  #       - 0.631
  #       - -1.57
  #       - 0.52
  #       pick_b_rpy:
  #       - 0.955
  #       - -1.57
  #       - 1.081
  #       place_a_offset:
  #       - 0
  #       - -0.02
  #       - 0
  #       place_b_offset:
  #       - 0
  #       - -0.02
  #       - 0
  #       do_approach: false
 
  - name: Four-arm flange home plus first shear approach
    mode: sequential
    actions:
    - action: four_arm_home_shear_approach
      with:
        shear_pick_a: 5pf
        shear_pick_b: 6pf
 
  - name: Shear links paired pick/place 8 ticks
    mode: sequential
    actions:
    - action: shear_pair
      with:
        pick_a: 5pf
        place_a: 5_placef_l
        object_a: rebar_5a
        pick_b: 6pf
        place_b: 6_placef_r
        object_b: rebar_6
        pick_a_offset:
        - 0
        - 0
        - 0
        pick_b_offset:
        - 0
        - 0
        - 0
        first_approach: true
    - action: shear_pair
      with:
        pick_a: 13pf
        place_a: 13_placef1_l
        object_a: rebar_13_1
        pick_b: 13_1pf
        place_b: 13_placef1_r
        object_b: rebar_13_1_R
        pick_a_offset:
        - 0
        - 0
        - 0
        pick_b_offset:
        - 0
        - 0
        - 0
        first_approach: true
    - action: shear_pair
      with:
        pick_a: 13pf
        place_a: 13_placef2_l
        object_a: rebar_13_2
        pick_b: 13_1pf
        place_b: 13_placef2_r
        object_b: rebar_13_2_R
        pick_a_offset:
        - 0.1
        - 0
        - 0
        pick_b_offset:
        - 0.118
        - 0
        - 0
        first_approach: true
    - action: shear_pair
      with:
        pick_a: 13pf
        place_a: 13_placef3_l
        object_a: rebar_13_3
        pick_b: 13_2pf
        place_b: 13_placef3_r
        object_b: rebar_13_3_R
        pick_a_offset:
        - 0.2
        - 0
        - 0
        pick_b_offset:
        - 0
        - 0
        - 0
        first_approach: true
    - action: shear_pair
      with:
        pick_a: 13pf
        place_a: 13_placef4_l
        object_a: rebar_13_4
        pick_b: 14_4pf
        place_b: 14_placef4_r
        object_b: rebar_14_1_R
        pick_a_offset:
        - 0.3
        - 0
        - 0
        pick_b_offset:
        - 0
        - 0
        - 0
        first_approach: true
    - action: shear_pair
      with:
        pick_a: 14pf
        place_a: 14_placef1_l
        object_a: rebar_14_1
        pick_b: 14_4pf
        place_b: 14_placef3_r
        object_b: rebar_14_2_R
        pick_a_offset:
        - 0
        - 0
        - 0
        pick_b_offset:
        - 0.112
        - 0
        - 0
        first_approach: true
    - action: shear_pair
      with:
        pick_a: 14pf
        place_a: 14_placef2_l
        object_a: rebar_14_2
        pick_b: 14_4pf
        place_b: 14_placef2_r
        object_b: rebar_14_3_R
        pick_a_offset:
        - 0.2
        - 0
        - 0
        pick_b_offset:
        - 0.224
        - 0
        - 0
        first_approach: true
    - action: shear_pair
      with:
        pick_a: 14pf
        place_a: 14_placef3_l
        object_a: rebar_14_3
        pick_b: 14_4pf
        place_b: 14_placef1_r
        object_b: rebar_14_4_R
        pick_a_offset:
        - 0.4
        - 0
        - 0
        pick_b_offset:
        - 0.336
        - 0
        - 0
        first_approach: true
 
  - name: Final unpaired Robot1 shear link
    mode: sequential
    actions:
    - action: shear_single
      with:
        pick: 14pf
        place: 14_placef4_l
        object: rebar_14_4
        pick_offset:
        - 0.6
        - 0
        - 0
 
  - name: Bottom mat Robot3/4 + Robot1/2 gripper change fused
    mode: sequential
    actions:
    - action: bottom_mat_and_gripper_change
      with:
        pick_a: bm_pkL
        pick_b: bm_pkR
        place_a: bm_pfl
        place_b: bm_pfr
        rebar: rebar_1A
 
  - name: Tying all shear links (19 Robot1 / 17 Robot2 positions)
    mode: sequential
    enabled: false
    actions:
    - action: tying_pair
      with:
        tie_a: 5_placef_l_t1
        tie_b: 6_placef_r_t1
    - action: tying_pair
      with:
        tie_a: 5_placef_l_t2
        tie_b: 6_placef_r_t2
    - action: tying_pair
      with:
        tie_a: 5_placef_l_t3
        tie_b: 6_placef_r_t3
    - action: tying_pair
      with:
        tie_a: 13_placef1_l_t1
        tie_b: 13_placef1_r_t1
    - action: tying_pair
      with:
        tie_a: 13_placef1_l_t2
        tie_b: 13_placef1_r_t2
    - action: tying_pair
      with:
        tie_a: 13_placef2_l_t1
        tie_b: 13_placef2_r_t1
    - action: tying_pair
      with:
        tie_a: 13_placef2_l_t2
        tie_b: 13_placef2_r_t2
    - action: tying_pair
      with:
        tie_a: 13_placef3_l_t1
        tie_b: 13_placef3_r_t1
    - action: tying_pair
      with:
        tie_a: 13_placef3_l_t2
        tie_b: 13_placef3_r_t2
    - action: tying_pair
      with:
        tie_a: 13_placef4_l_t1
        tie_b: 14_placef1_r_t1
    - action: tying_pair
      with:
        tie_a: 13_placef4_l_t2
        tie_b: 14_placef1_r_t2
    - action: tying_pair
      with:
        tie_a: 14_placef1_l_t1
        tie_b: 14_placef2_r_t1
    - action: tying_pair
      with:
        tie_a: 14_placef1_l_t2
        tie_b: 14_placef2_r_t2
    - action: tying_pair
      with:
        tie_a: 14_placef2_l_t1
        tie_b: 14_placef3_r_t1
    - action: tying_pair
      with:
        tie_a: 14_placef2_l_t2
        tie_b: 14_placef3_r_t2
    - action: tying_pair
      with:
        tie_a: 14_placef3_l_t1
        tie_b: 14_placef4_r_t1
    - action: tying_pair
      with:
        tie_a: 14_placef3_l_t2
        tie_b: 14_placef4_r_t2
    - action: tying_single
      with:
        tie_a: 14_placef4_l_t1
    - action: tying_single
      with:
        tie_a: 14_placef4_l_t2
 
  - name: Tying bottom mat (three paired tie positions)
    mode: sequential
    enabled: false
    actions:
    - action: tying_pair
      with:
        tie_a: 1A_l_t1
        tie_b: 1A_r_t1
    - action: tying_pair
      with:
        tie_a: 1A_l_t2
        tie_b: 1A_r_t2
    - action: tying_pair
      with:
        tie_a: 1A_l_t3
        tie_b: 1A_r_t3
 
  - name: Pick and place final assembly
    mode: sequential
    enabled: false
    actions:
    - action: final_assembly
      with: {}

# PART B: ACTION LIBRARY — reusable motion templates and object operations
# Phase 2 reverse ends at approach; subsequent flange_pp performs 3D/4D pickup/place.
action_library:
  schema_version: 1
  workcell_package: sa2_description
  workcell_file: config/workcell.yaml
  collision_group: sa3_all_robots
  acm_lock: /tmp/sa3_action_engine_acm.lock
  planning:
# Debug in confirmed simulation only. Set true for full-cell safety validation.
    full_cell_collision_check: false
    # Diagnostic only: publish rejected merged paths to RViz, never execute them.
    preview_rejected_trajectories: false

    planning_time: 15
    planning_attempts: 10
    acceleration: 0.45
    moveJ:
      velocity: 0.5
      retries: 3
    moveL:
      velocity_scales: [0.5, 0.45, 0.4, 0.35, 0.3, 0.25, 0.2, 0.15, 0.1, 0.05]
    movePTP:
      velocity_scales: [0.5, 0.45, 0.4, 0.35, 0.3, 0.25, 0.2, 0.15, 0.1, 0.05]
    moveC:
      velocity_scales: [0.5, 0.45, 0.4, 0.35, 0.3, 0.25, 0.2, 0.15, 0.1, 0.05]
    fallbacks:
      movePTP:
        - moveJ
  actions:
    # ACTION: initialize_schunk_grippers
    # Attach both Schunk collision objects to the robot tool mounts at initialization.
    initialize_schunk_grippers:
      defaults: {}
      steps:
        - op: attach
          id: A1_attach_robot1_schunk
          object: robot1_schunk_base
          link: robot1_tool_mount
          placement_mode: dock_to_mount
          touch_links: &robot1_schunk_touch_links
            - robot1_tool_mount
            - robot1_J4_link
            - robot1_J5_link
            - robot1_J6_link
          dock_frame: robot1_shuck_dock
        - op: attach
          id: A2_attach_robot2_schunk
          object: robot2_schunk_base
          link: robot2_tool_mount
          placement_mode: dock_to_mount
          touch_links: &robot2_schunk_touch_links
            - robot2_tool_mount
            - robot2_J4_link
            - robot2_J5_link
            - robot2_J6_link
          dock_frame: robot2_shuck_dock

    # ACTION: flange_pp
    # Two-arm flange rebar pickup, transfer, placement and optional home.
    flange_pp:
      defaults:
        robot_a: robot3
        robot_b: robot4
        group: robot3_robot4_arms
        do_home: true
        pick_a_offset: [0, 0, 0]
        pick_b_offset: [0, 0, 0]
        place_a_offset: [0, 0, 0]
        place_b_offset: [0, 0, 0]
        inventory_a: inventory_3a_4a
        inventory_b: inventory_3a_4a_2
        tool_link_a: robot3_end_effactor_ff
        tool_link_b: robot4_end_effactor_ff
        pick_a_rpy: [0, 0, 0]
        pick_b_rpy: [0, 0, 0]
        do_approach: true
      steps:
        - op: move
          id: P1
          motion: movePTP
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{approach_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{approach_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
          enabled: '{{do_approach}}'
        - op: move
          id: P2
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{pick_a}}'
                offset_frame: local
                xyz: '{{pick_a_offset}}'
                rpy: '{{pick_a_rpy}}'
                rpy_frame: local
            - robot: '{{robot_b}}'
              target:
                reference: '{{pick_b}}'
                offset_frame: local
                xyz: '{{pick_b_offset}}'
                rpy: '{{pick_b_rpy}}'
                rpy_frame: local
          before:
            - op: acm_allow
              id: P2_allow_grip
              pairs: [['{{object_a}}', '{{tool_link_a}}'], 
                      ['{{object_a}}', robot3_sa3_grpr01], 
                      ['{{object_b}}', '{{tool_link_b}}'], 
                      ['{{object_b}}',robot4_sa3_grpr01_r]]
          after:
            - op: attach
              id: P2_attach_a
              object: '{{object_a}}'
              link: robot3_end_effactor_ff
              placement_mode: preserve_world
              touch_links: &robot3_rebar_touch_links
                - robot3_end_effactor_ff
                - robot3_J6_link
                - robot3_sa3_grpr01
            - op: attach
              id: P2_attach_b
              object: '{{object_b}}'
              link: robot4_end_effactor_ff
              placement_mode: preserve_world
              touch_links: &robot4_rebar_touch_links
                - robot4_end_effactor_ff
                - robot4_J6_link
                - robot4_sa3_grpr01_r
            - op: acm_allow
              id: P2_allow_inventory_contact
              pairs: [['{{object_a}}', '{{inventory_a}}'], 
                      ['{{object_b}}', '{{inventory_b}}']]
        - op: move
          id: P3
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: [0.0, 0.3, 0.3]
                rpy: '{{pick_a_rpy}}'
                base_xyz: '{{pick_a_offset}}'
                base_offset_frame: local
                rpy_frame: local
            - robot: '{{robot_b}}'
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: [0.0, 0.3, 0.3]
                rpy: '{{pick_b_rpy}}'
                base_xyz: '{{pick_b_offset}}'
                base_offset_frame: local
                rpy_frame: local
          after:
            - op: acm_restore
              id: P3_restore_inventory_contact
              pairs: [['{{object_a}}', '{{inventory_a}}'], 
                      ['{{object_b}}', '{{inventory_b}}']]
        - op: move
          id: T1
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{transfer_start_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{transfer_start_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
        - op: move
          id: T2
          motion: movePTP
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{transfer_end_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{transfer_end_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
        - op: move
          id: G1
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          before:
            - op: acm_allow
              id: G1_allow_jig_contact
              pairs: [['{{object_a}}', jig_clamp], 
                      ['{{object_b}}', jig_clamp]]
        - op: move
          id: G2
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: '{{place_a_offset}}'
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: '{{place_b_offset}}'
                rpy: [0, 0, 0]
          after:
            - op: detach
              id: G2_detach_a
              object: '{{object_a}}'
              link: robot3_end_effactor_ff
            - op: detach
              id: G2_detach_b
              object: '{{object_b}}'
              link: robot4_end_effactor_ff
            - op: acm_allow
              id: G2_reallow_grip_for_retract
              pairs: [['{{object_a}}', '{{tool_link_a}}'], 
                      ['{{object_a}}', robot3_sa3_grpr01], 
                      ['{{object_b}}', '{{tool_link_b}}'], 
                      ['{{object_b}}',robot4_sa3_grpr01_r]]
        - op: move
          id: G3
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          after:
            - op: acm_restore
              id: G3_restore_jig_contact
              pairs: [['{{object_a}}', jig_clamp], 
                      ['{{object_b}}', jig_clamp]]
            - op: acm_restore
              id: P2_restore_grip
              pairs: [['{{object_a}}', '{{tool_link_a}}'], 
                      ['{{object_a}}', robot3_sa3_grpr01], 
                      ['{{object_b}}', '{{tool_link_b}}'], 
                      ['{{object_b}}', robot4_sa3_grpr01_r]]
        - op: move
          id: H1
          motion: moveJ
          strategy: combined
          group: '{{group}}'
          goals:
            - robot: '{{robot_a}}'
              named_state: home
            - robot: '{{robot_b}}'
              named_state: home
          enabled: '{{do_home}}'
    
    # ACTION: gantry_pick_transfer
    # Raise/lower/transport rebar using gantry x/z commands; each send waits.
    gantry_pick_transfer:
      defaults:
        gantry_pick_x: 0.0
        gantry_pick_z: 4.1
        gantry_transport_x: -6.0
        gantry_up_z: 0.0
        gantry_link: gantry_part_link
        rebar: rebar_1A
      steps:
        # gantry_send: id identifies this command; wait/timeout use executor defaults.
        - op: gantry_send
          id: G1_home
          x: '{{gantry_pick_x}}'
          z: '{{gantry_up_z}}'
          velocity: 1.45
          acceleration: 1.0
        - op: gantry_send
          id: G2_lower
          x: '{{gantry_pick_x}}'
          z: '{{gantry_pick_z}}'
          velocity: 0.45
          acceleration: 0.5
        - op: attach
          id: G2_attach_rebar
          object: '{{rebar}}'
          link: '{{gantry_link}}'
          placement_mode: preserve_world
          touch_links:
            - '{{gantry_link}}'
        - op: gantry_send
          id: G3_raise
          x: '{{gantry_pick_x}}'
          z: '{{gantry_up_z}}'
          velocity: 0.45
          acceleration: 0.5
        - op: gantry_send
          id: G4_transport
          x: '{{gantry_transport_x}}'
          z: '{{gantry_up_z}}'
          velocity: 0.45
          acceleration: 0.5

    # ACTION: four_arm_home_shear_approach
    # Combined robot3/4 home plus robot1/2 shear prepositioning.
    four_arm_home_shear_approach:
      defaults: {}
      steps:
        - op: move
          id: H1_plus_P1
          motion: moveJ
          strategy: combined
          group: sa3_all_robots
          goals:
            - robot: robot3
              named_state: home
            - robot: robot4
              named_state: home
            - robot: robot1
              target:
                reference: '{{shear_pick_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{shear_pick_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
  
    # ACTION: shear_pair
    # Robot1+Robot2 shear rebar pickup/place with ACM lifecycle and transit fallback.
    shear_pair:
      defaults:
        first_approach: true
        group: sa3_robots_1_2
        pick_a_offset: [0, 0, 0]
        pick_b_offset: [0, 0, 0]
        inventory_a: web_ring
        inventory_b: web_ring_2
      steps:
        - op: move
          id: P1
          motion: moveL
          strategy: separate_merge
          # Transit: LIN first; Pilz CIRC via-point second; OMPL joint last.
          circ_via_world_x: {robot1: 0.235, robot2: 5.22}
          fallbacks:
            - {motion: moveC, strategy: separate_merge}
            - {motion: moveJ, strategy: separate_merge}
          group: sa3_robots_1_2
          participants: &robot1_robot2_participants
            - robot1
            - robot2
          goals:
            - robot: robot1
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          enabled: '{{first_approach}}'
        - op: move
          id: P2
          motion: moveL
          strategy: separate_merge
          group: sa3_robots_1_2
          participants: *robot1_robot2_participants
          goals:
            - robot: robot1
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: '{{pick_a_offset}}'
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: '{{pick_b_offset}}'
                rpy: [0, 0, 0]
          before:
            - op: acm_allow
              id: P2_allow_gripper_contact
              pairs: [['{{object_a}}', robot1_tool_mount], 
                      ['{{object_a}}', robot1_schunk_base], 
                      ['{{object_b}}', robot2_tool_mount], 
                      ['{{object_b}}', robot2_schunk_base]]
          after:
            - op: attach
              id: P2_attach_a
              object: '{{object_a}}'
              link: robot1_tool_mount
              placement_mode: preserve_world
              touch_links: *robot1_schunk_touch_links
            - op: attach
              id: P2_attach_b
              object: '{{object_b}}'
              link: robot2_tool_mount
              placement_mode: preserve_world
              touch_links: *robot2_schunk_touch_links
            - op: acm_allow
              id: P2_allow_inventory_contact
              pairs: [['{{object_a}}', '{{inventory_a}}'], 
                      ['{{object_b}}', '{{inventory_b}}']]
        - op: move
          id: P3
          motion: moveL
          strategy: separate_merge
          group: sa3_robots_1_2
          participants: *robot1_robot2_participants
          goals:
            - robot: robot1
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          after:
            - op: acm_restore
              id: P3_restore_inventory_contact
              pairs: [['{{object_a}}', '{{inventory_a}}'], 
                      ['{{object_b}}', '{{inventory_b}}']]
        - op: move
          id: T1
          motion: moveL
          strategy: separate_merge
          # Transit: LIN first; Pilz CIRC via-point second; OMPL joint last.
          circ_via_world_x: {robot1: 0.235, robot2: 5.22}
          fallbacks:
            - {motion: moveC, strategy: separate_merge}
            - {motion: moveJ, strategy: separate_merge}
          group: sa3_robots_1_2
          participants: *robot1_robot2_participants
          goals:
            - robot: robot1
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
        - op: move
          id: G1
          motion: moveL
          strategy: separate_merge
          group: sa3_robots_1_2
          participants: *robot1_robot2_participants
          goals:
            - robot: robot1
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
          after:
            - op: detach
