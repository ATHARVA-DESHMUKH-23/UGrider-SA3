
# Motion sequence configuration for sa3_motion_sequence.launch.py
# mode: parallel | sequential
# on_failure: abort | continue | final_home | finish
# retries is the total number of attempts, including the first attempt.

motion_sequence:
  stages:
    - name: "Pick/place Half web flanges"
      executables:
        - name: robot3_motion
          parameters:
            pick_frame: inventory_3a_4a_frame
            place_frame: place_frame_10_l
            object_id: rebar_3d

        - name: robot4_motion
          parameters:
            pick_frame: inventory_3a_4a_frame_2
            place_frame: place_frame_10
            object_id: rebar_4d

        - attach_tool
      mode: parallel
      retries: 1
      on_failure: abort

    - name: "Pick/place web flanges"
      executables:
        - name: robot3_motion
          parameters:
            pick_frame: inventory_3a_4a_frame
            pick_offset: [0.0, -0.1, 0.0]
            place_frame: place_frame_10_l
            place_offset: [0.0, -0.02, 0.0]
            object_id: rebar_3c

        - name: robot4_motion
          parameters:
            pick_frame: inventory_3a_4a_frame_2
            pick_offset: [0.0, -0.1, 0.0]
            place_frame: place_frame_10
            place_offset: [0.0, -0.02, 0.0]
            object_id: rebar_4c
      mode: parallel
      retries: 1
      on_failure: abort

    - name: "Pick/place shear clamps and rebars"
      executables:
        - robot1_motion
        - robot2_motion
      mode: parallel
      retries: 1
      on_failure: abort

    - name: "home all robots"
      executables:
        - home_all_robots
      mode: sequential
      retries: 3
      on_failure: continue


    - name: "Change gripper"
      executables:
        - robot1_gripper_change
      mode: sequential
      retries: 3
      on_failure: continue

    - name: "Tie clamps with tying guns"
      executables:
        - robot1_tying_gun
        - robot2_tying_gun
      mode: parallel
      retries: 1
      on_failure: abort

    - name: "place rebar 1A with gantry and robot3"
      executables:
        - gantry_move
      mode: sequential
      retries: 1
      on_failure: abort


    - name: "Tie Bottom Mat with tying guns"
      executables:
        - name: robot1_tying_gun
          parameters:
            clamp_frames:
              - "1A_l"
            tie_counts: [3]

        - name: robot2_tying_gun
          parameters:
            clamp_frames:
              - "1A_r"
            tie_counts: [3]

      mode: parallel
      retries: 1
      on_failure: abort

    - name: "Pick/place final assembly"
      executables:
        - name: robot3_sa3pp
          parameters:
            pick_frame: sa3_pick_point
            place_frame: sa3_place
            object_id: rebar_1A
            children:
              - rebar_3c
              - rebar_4c
              - rebar_3d
              - rebar_4d
              - rebar_5a
              - rebar_6
              - rebar_13_1
              - rebar_13_2
              - rebar_13_3
              - rebar_13_4
              - rebar_14_1
              - rebar_14_2
              - rebar_14_3
              - rebar_14_4
              - rebar_13_1_R
              - rebar_13_2_R
              - rebar_13_3_R
              - rebar_14_4_R
              - rebar_14_3_R
              - rebar_14_2_R
              - rebar_14_1_R
      mode: sequential
      retries: 1
      on_failure: abort

    - name: "Final home all robots"
      executables:
        - home_all_robots
      mode: sequential
      retries: 3
      on_failure: final_home
