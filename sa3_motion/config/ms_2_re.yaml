          - 0
          rpy:
          - 0.0
          - 0.0
          - 0.0
        robot4:
          reference: place_frame
          offset_frame: world
          xyz:
          - 0
          - -0.25
          - 0
          rpy:
          - 0.0
          - 0.0
          - 0.0
        before_actions:
