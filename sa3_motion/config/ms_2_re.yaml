        pick_offset_frame: local
        pick_offset_rpy: [0.627, -1.57, 0.627]
        pick_offset_rpy_frame: local
        place_offset: [0.0, 0.01, 0.0]
        place_offset_rpy: [0.0, 0.0, 0.0]
        arc_frames:
