          - 0.6
          - 0
          - 0.6
          rpy:
          - 0.0
          - 0.0
          - 0.0
        after_actions:
        - restore_inventory_contact
      - id: T1
        description: Original sampled arc transfer
        motion: moveL
        repeat: arc_waypoints
        robot3:
          reference: arc_waypoint
          offset_frame: world
          xyz:
          - 0
          - 0
          - 0
          rpy:
          - 0.0
          - 0.0
          - 0.0
        robot4:
