
# Motion sequence configuration for sa3_motion_sequence.launch.py
# mode: parallel | sequential
# on_failure: abort | continue | final_home | finish
# retries is the total number of attempts, including the first attempt.
# This file schedules ROS executables; the fine-grained flange motion steps
# and their collision actions live under workcell.planner_sequence.flange_pp
# The shear, tying and dual gripper programs read the corresponding
# workcell.planner_sequence keys in sa2_description/config/workcell.yaml.
# Gantry/Robot3 steps live under workcell.planner_sequence.gantry_move.
# in the description package config/workcell.yaml.

motion_sequence:
  stages:
    - name: "Attach Schunk grippers"
      executables:
        - attach_tool
      mode: sequential
      retries: 1
      on_failure: abort

    - name: "Pick/place Half web flanges"
      executables:
        - name: flange_pp
          parameters:
            workcell_config_package: sa2_description
            workcell_config_file: config/workcell.yaml
      mode: sequential
      retries: 1
      on_failure: abort



    - name: "Pick/place shear links with robot1 and robot2"
      executables:
        - name: shear_links_pp
          parameters:
            workcell_config_package: sa2_description
            workcell_config_file: config/workcell.yaml
      mode: sequential
      retries: 1
      on_failure: abort

    - name: "Change gripper"
      executables:
        - name: robot1_gripper_change
          parameters:
            workcell_config_package: sa2_description
            workcell_config_file: config/workcell.yaml
      mode: sequential
      retries: 3
      on_failure: continue

    - name: "Tie clamps with tying guns"
      executables:
        - name: tying_rebars
          parameters:
            workcell_config_package: sa2_description
            workcell_config_file: config/workcell.yaml
      mode: parallel
      retries: 1
      on_failure: abort

    - name: "place rebar 1A with gantry and robot3"
      executables:
        - name: gantry_move
          parameters:
            workcell_config_package: sa2_description
            workcell_config_file: config/workcell.yaml
      mode: sequential
      retries: 1
      on_failure: abort


    - name: "Tie Bottom Mat with tying guns"
      executables:
        - name: tying_rebars
          parameters:
            workcell_config_package: sa2_description
            workcell_config_file: config/workcell.yaml
            robot1_clamp_frames: ["1A_l"]
            robot1_tie_counts: [3]
            robot2_clamp_frames: ["1A_r"]
            robot2_tie_counts: [3]

      mode: parallel
      retries: 1
      on_failure: abort

    - name: "Pick/place final assembly"
      executables:
        - name: robot3_sa3pp
          parameters:
            pick_frame: sa3_pick_point
            place_frame: sa3_place
            object_id: rebar_1A
            children:
              - rebar_3c
              - rebar_4c
              - rebar_5a
              - rebar_6
              - rebar_13_1
              - rebar_13_2
              - rebar_13_3
              - rebar_13_4
              - rebar_14_1
              - rebar_14_2
              - rebar_14_3
              - rebar_14_4
              - rebar_13_1_R
              - rebar_13_2_R
              - rebar_13_3_R
              - rebar_14_4_R
              - rebar_14_3_R
              - rebar_14_2_R
              - rebar_14_1_R
      mode: sequential
      retries: 1
      on_failure: abort

    - name: "Final home all robots"
      executables:
        - home_all_robots
      mode: sequential
      retries: 3
      on_failure: final_home