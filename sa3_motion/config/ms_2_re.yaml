  #         pick_retract_offset_world: [0.0, -0.20, 0.0]
  #         place_approach_offset_world: [0.0, 0.0, 0.30]
  #         # Independent place retract
  #         robot3_place_retract_offset_world: [-0.05, 0.0, 0.0]
