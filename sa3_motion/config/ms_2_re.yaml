        place_offset_rpy: [0.0, 0.0, 0.0]
        arc_frames:
        - r4_arc_start
        - r4_arc_mid
        - r4_arc_end
      jig_object_id: jig_clamp
      arc_points: 8
      planning:
        planning_time: 15.0
        planning_attempts: 10
        retries: 3
        ik_timeout: 1.0
        movej_velocity: 0.5
        movej_acceleration: 0.5
        movel_velocity: 0.45
        movel_acceleration: 0.45
      steps:
      - id: P1
        motion: moveJ
        description: Pick approach
        robot3:
          reference: inventory_3a_4a_frame
          offset_frame: world
          xyz: [0.0, 0, 0]
          rpy: [0.0, 0.0, 0.0]
        robot4:
          reference: inventory_3a_4a_frame_2
          offset_frame: world
          xyz: [0, 0.0, 0]
          rpy: [0.0, 0.0, 0.0]
      - id: P2
        motion: moveL
        description: Pick and attach
        robot3:
          reference: pick_frame
          offset_frame: world
          xyz: [-0.0, 0, 0]
          rpy: [0.0, 0.0, 0.0]
        robot4:
          reference: pick_frame
          offset_frame: world
          xyz: [0, 0, 0]
          rpy: [0.0, 0.0, 0.0]
        before_actions:
        - prepare_pick
        after_actions:
        - attach_objects
        - allow_inventory_contact
      - id: P3
        motion: moveL
        description: Pick retract
        robot3:
          reference: pick_frame
          offset_frame: world
          xyz: [0, 0.3, 0.3]
          rpy: [0.0, 0.0, 0.0]
        robot4:
          reference: pick_frame
          offset_frame: world
          xyz: [0, 0.3, 0.3]
          rpy: [0.0, 0.0, 0.0]
        after_actions:
        - restore_inventory_contact
      - id: T1
        motion: moveL
        description: Move both robots to PTP start frames
        robot3:
          reference: r3_ptp_start
          offset_frame: world
          xyz: [0, 0, 0]
          rpy: [0.0, 0.0, 0.0]
        robot4:
          reference: r4_ptp_start
          offset_frame: world
          xyz: [0, 0, 0]
          rpy: [0.0, 0.0, 0.0]
      - id: T2
        motion: moveL
        description: Paired Pilz LIN transfer from PTP start to end; combined MoveJ fallback
        robot3:
          reference: r3_ptp_end
          offset_frame: world
          xyz: [0, 0, 0]
          rpy: [0.0, 0.0, 0.0]
        robot4:
          reference: r4_ptp_end
          offset_frame: world
          xyz: [0, 0, 0]
          rpy: [0.0, 0.0, 0.0]
      - id: G1
