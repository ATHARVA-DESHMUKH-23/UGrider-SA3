          reference: pick_frame
          offset_frame: world
          xyz:
          - 0
          - 0
          - 0
          rpy:
          - 0.0
          - 0.0
          - 0.0
        robot4:
          reference: pick_frame
          offset_frame: world
          xyz:
          - 0
          - 0
          - 0
          rpy:
          - 0.0
          - 0.0
          - 0.0
