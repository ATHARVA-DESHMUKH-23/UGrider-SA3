  combined_motions:
    flange_home_with_shear_P1:
      group: sa3_all_robots
      planner_id: RRTConnectkConfigDefault
      velocity_scale: 0.45
      acceleration_scale: 0.4
      planning_time: 30.0
      planning_attempts: 12
      ik_timeout: 2.0
      validation_joint_step_rad: 0.05
      operations:
      - task: flange_3d_4d
        step: H1
      - task: shear_links_2_re
        step: P1
        pair_index: 0


