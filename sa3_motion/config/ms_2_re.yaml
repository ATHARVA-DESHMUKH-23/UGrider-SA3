# Dual Robot3+Robot4 motion + Phase 1/5 persistent gantry checkpoint orchestration.
# Robot3 alone attaches/detaches rebar_1A; Robot4 shadows R1-R7.
motion_sequence:
  schema_version: 2
  stages:
  - name: Initialize Schunk gripper attachments
    mode: sequential
    executables:
    - name: attach_tool
    retries: 1
    on_failure: abort
  
  - name: PHASE 1 - flange 3C 4C overlaps gantry transport to G4
    mode: overlap
    executables:
    - name: gantry_move
      background: true
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_config_package: sa3_motion
        motion_config_file: config/ms_2_re.yaml
        motion_task: gantry_bottom_mat_2_re
        pause_after_g4: true
        pause_after_r3: true
        checkpoint_tolerance_m: 0.01
    - name: flange_pp
      background: false
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_config_package: sa3_motion
        motion_config_file: config/ms_2_re.yaml
        motion_task: flange_3c_4c
        skip_home: true
    retries: 1
    on_failure: abort
  
  - name: PHASE 2 - reverse Pilz PTP and flange 3D 4D without home
    mode: sequential
    executables:
    - name: flange_pp
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_config_package: sa3_motion
        motion_config_file: config/ms_2_re.yaml
        motion_task: flange_3d_4d
        skip_home: true
        wait_for_gantry_g4: true
        gantry_checkpoint_timeout_sec: 180.0
    retries: 1
    on_failure: abort
  
  - name: PHASE 3A - combined 24 joint flange home plus shear first P1
    mode: combined
    combined_step: flange_home_with_shear_P1
    execute_motion: true
    retries: 1
    on_failure: abort
  
  - name: PHASE 4 - complete shear links from verified P1
    mode: sequential
    executables:
    - name: shear_links_pp
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_config_package: sa3_motion
        motion_config_file: config/ms_2_re.yaml
        motion_task: shear_links_2_re
        first_p1_prepositioned: true
    retries: 1
    on_failure: abort
  
  # Phase 5: no custom cell-safety gate or sampled /check_state_validity requests.
  # Both motion nodes execute concurrently; retain G5/R3 handoff and done/abort handshake.
  # WARNING: independent MoveIt plans are not synchronized inter-robot collision validation.
  - name: PHASE 5 - Robot3+4 pick place and Robot1+2 gripper change concurrently
    mode: parallel
    executables:
    - name: sa3_combined_motion
      parameters:
        workflow_mode: phase3_phase5_parallel
        execute_motion: true
        require_robot4_already_home: true
        phase3_combined_group: robot3_robot4_arms
        phase3_collision_group: sa3_all_robots
        robot3_group: robot3_arm
        robot4_group: robot4_arm
        phase3_checkpoint_timeout_sec: 240.0
        phase5_timeout_sec: 1800.0
        phase5_checkpoint_timeout_sec: 240.0
    - name: robot1_gripper_change
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_config_package: sa3_motion
        motion_config_file: config/ms_2_re.yaml
        motion_task: change_to_tying_guns
        wait_for_gantry_g5: true
        gantry_g5_wait_timeout_sec: 240.0
    retries: 1
    on_failure: abort
  - name: PHASE 6A - tying_2_re
    mode: sequential
    executables:
    - name: tying_rebars
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_config_package: sa3_motion
        motion_config_file: config/ms_2_re.yaml
        motion_task: tying_2_re
    retries: 1
    on_failure: abort
  - name: PHASE 6B - tying_bottom_mat_2_re
    mode: sequential
    executables:
    - name: tying_rebars
      parameters:
        workcell_config_package: sa2_description
        workcell_config_file: config/workcell.yaml
        motion_config_package: sa3_motion
        motion_config_file: config/ms_2_re.yaml
        motion_task: tying_bottom_mat_2_re
    retries: 1
    on_failure: abort
  
