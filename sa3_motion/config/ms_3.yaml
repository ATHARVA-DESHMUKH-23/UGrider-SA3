
# Motion sequence configuration for sa3_motion_sequence.launch.py
# mode: parallel | sequential
# on_failure: abort | continue | final_home | finish
# retries is the total number of attempts, including the first attempt.

motion_sequence:
  stages:
    - name: "Pick/place web flanges"
      executables:
        - name: robot3_motion
          parameters:
            pick_frame: inventory_3a_4a_frame
            place_frame: place_frame_10_l
            object_id: rebar_3c

        - name: robot4_motion
          parameters:
            pick_frame: inventory_3a_4a_frame_2
            place_frame: place_frame_10
            object_id: rebar_4c

        - attach_tool
      mode: parallel
      retries: 1
      on_failure: abort


    
    - name: "Pick/place only web rings "
      executables:
        - name: robot1_motion
          parameters:
            pick_place_pairs:
              - "5pf,5_placef_l,rebar_5a,0.0,0.0,0.0"

        - name: robot2_motion
          parameters:
            pick_place_pairs:
              - "6pf,6_placef_r,rebar_6,0.0,0.0,0.0"

      mode: parallel
      retries: 1
      on_failure: abort


    - name: "Change gripper"
      executables:
        - robot1_gripper_change
      mode: sequential
      retries: 3
      on_failure: continue

    
    - name: "Tie only web rings with tying guns"
      executables:
        - name: robot1_tying_gun
          parameters:
            clamp_frames:
              - "5_placef_l"
            tie_counts: [3]

        - name: robot2_tying_gun
          parameters:
            clamp_frames:
              - "6_placef_r"
            tie_counts: [3]

      mode: parallel
      retries: 1
      on_failure: abort

    - name: "place rebar 1A with gantry and robot3"
      executables:
        - gantry_move
      mode: sequential
      retries: 1
      on_failure: abort

    - name: "Tie Bottom Mat with tying guns"
      executables:
        - name: robot1_tying_gun
          parameters:
            clamp_frames:
              - "1A_l"
            tie_counts: [3]

        - name: robot2_tying_gun
          parameters:
            clamp_frames:
              - "1A_r"
            tie_counts: [3]

      mode: parallel
      retries: 1
      on_failure: abort


    - name: "Pick/place final assembly"
      executables:
        - name: robot3_sa3pp
          parameters:
            pick_frame: sa3_pick_point
            place_frame: sa3_place
            object_id: rebar_1A
            children:
              - rebar_3c
              - rebar_4c
              - rebar_5a
              - rebar_6
      mode: sequential
      retries: 1
      on_failure: abort

    - name: "Final home all robots"
      executables:
        - home_all_robots
      mode: sequential
      retries: 3
      on_failure: final_home
