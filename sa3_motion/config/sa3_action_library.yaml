# Phase 2: flange_reverse_pp = B1/B2/P1 only; flange_pp = pickup/place, optionally skip P1.
action_library:
  schema_version: 1
  workcell_package: sa2_description
  workcell_file: config/workcell.yaml
  collision_group: sa3_all_robots
  acm_lock: /tmp/sa3_action_engine_acm.lock
  planning:
# Debug in confirmed simulation only. Set true for full-cell safety validation.
    full_cell_collision_check: false
    # Diagnostic only: publish rejected merged paths to RViz, never execute them.
    preview_rejected_trajectories: false

    planning_time: 15
    planning_attempts: 10
    acceleration: 0.45
    moveJ:
      velocity: 0.5
      retries: 3
    moveL:
      velocity_scales: [0.5, 0.45, 0.4, 0.35, 0.3, 0.25, 0.2, 0.15, 0.1, 0.05]
    movePTP:
      velocity_scales: [0.5, 0.45, 0.4, 0.35, 0.3, 0.25, 0.2, 0.15, 0.1, 0.05]
    moveC:
      velocity_scales: [0.5, 0.45, 0.4, 0.35, 0.3, 0.25, 0.2, 0.15, 0.1, 0.05]
    fallbacks:
      movePTP:
        - moveJ
  actions:
    initialize_schunk_grippers:
      defaults: {}
      steps:
        - op: attach
          id: A1_attach_robot1_schunk
          object: robot1_schunk_base
          link: robot1_tool_mount
          placement_mode: dock_to_mount
          touch_links: &id002
            - robot1_tool_mount
            - robot1_J4_link
            - robot1_J5_link
            - robot1_J6_link
          dock_frame: robot1_shuck_dock
        - op: attach
          id: A2_attach_robot2_schunk
          object: robot2_schunk_base
          link: robot2_tool_mount
          placement_mode: dock_to_mount
          touch_links: &id003
            - robot2_tool_mount
            - robot2_J4_link
            - robot2_J5_link
            - robot2_J6_link
          dock_frame: robot2_shuck_dock

    flange_pp:
      defaults:
        robot_a: robot3
        robot_b: robot4
        group: robot3_robot4_arms
        do_home: true
        pick_a_offset: [0, 0, 0]
        pick_b_offset: [0, 0, 0]
        place_a_offset: [0, 0, 0]
        place_b_offset: [0, 0, 0]
        inventory_a: inventory_3a_4a
        inventory_b: inventory_3a_4a_2
        tool_link_a: robot3_end_effactor_ff
        tool_link_b: robot4_end_effactor_ff
        pick_a_rpy: [0, 0, 0]
        pick_b_rpy: [0, 0, 0]
        do_approach: true
      steps:
        - op: move
          id: P1
          motion: movePTP
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{approach_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{approach_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
          enabled: '{{do_approach}}'
        - op: move
          id: P2
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{pick_a}}'
                offset_frame: local
                xyz: '{{pick_a_offset}}'
                rpy: '{{pick_a_rpy}}'
                rpy_frame: local
            - robot: '{{robot_b}}'
              target:
                reference: '{{pick_b}}'
                offset_frame: local
                xyz: '{{pick_b_offset}}'
                rpy: '{{pick_b_rpy}}'
                rpy_frame: local
          before:
            - op: acm_allow
              id: P2_allow_grip
              pairs: [['{{object_a}}', '{{tool_link_a}}'], 
                      ['{{object_a}}', robot3_sa3_grpr01], 
                      ['{{object_b}}', '{{tool_link_b}}'], 
                      ['{{object_b}}',robot4_sa3_grpr01_r]]
          after:
            - op: attach
              id: P2_attach_a
              object: '{{object_a}}'
              link: robot3_end_effactor_ff
              placement_mode: preserve_world
              touch_links: &id005
                - robot3_end_effactor_ff
                - robot3_J6_link
                - robot3_sa3_grpr01
            - op: attach
              id: P2_attach_b
              object: '{{object_b}}'
              link: robot4_end_effactor_ff
              placement_mode: preserve_world
              touch_links: &id007
                - robot4_end_effactor_ff
                - robot4_J6_link
                - robot4_sa3_grpr01_r
            - op: acm_allow
              id: P2_allow_inventory_contact
              pairs: [['{{object_a}}', '{{inventory_a}}'], 
                      ['{{object_b}}', '{{inventory_b}}']]
        - op: move
          id: P3
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: [0.0, 0.3, 0.3]
                rpy: '{{pick_a_rpy}}'
                base_xyz: '{{pick_a_offset}}'
                base_offset_frame: local
                rpy_frame: local
            - robot: '{{robot_b}}'
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: [0.0, 0.3, 0.3]
                rpy: '{{pick_b_rpy}}'
                base_xyz: '{{pick_b_offset}}'
                base_offset_frame: local
                rpy_frame: local
          after:
            - op: acm_restore
              id: P3_restore_inventory_contact
              pairs: [['{{object_a}}', '{{inventory_a}}'], 
                      ['{{object_b}}', '{{inventory_b}}']]
        - op: move
          id: T1
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{transfer_start_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{transfer_start_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
        - op: move
          id: T2
          motion: movePTP
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{transfer_end_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{transfer_end_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
        - op: move
          id: G1
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          before:
            - op: acm_allow
              id: G1_allow_jig_contact
              pairs: [['{{object_a}}', jig_clamp], 
                      ['{{object_b}}', jig_clamp]]
        - op: move
          id: G2
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: '{{place_a_offset}}'
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: '{{place_b_offset}}'
                rpy: [0, 0, 0]
          after:
            - op: detach
              id: G2_detach_a
              object: '{{object_a}}'
              link: robot3_end_effactor_ff
            - op: detach
              id: G2_detach_b
              object: '{{object_b}}'
              link: robot4_end_effactor_ff
            - op: acm_allow
              id: G2_reallow_grip_for_retract
              pairs: [['{{object_a}}', '{{tool_link_a}}'], 
                      ['{{object_a}}', robot3_sa3_grpr01], 
                      ['{{object_b}}', '{{tool_link_b}}'], 
                      ['{{object_b}}',robot4_sa3_grpr01_r]]
        - op: move
          id: G3
          motion: moveL
          strategy: separate_merge
          group: '{{group}}'
          participants:
            - '{{robot_a}}'
            - '{{robot_b}}'
          goals:
            - robot: '{{robot_a}}'
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: '{{robot_b}}'
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          after:
            - op: acm_restore
              id: G3_restore_jig_contact
              pairs: [['{{object_a}}', jig_clamp], 
                      ['{{object_b}}', jig_clamp]]
            - op: acm_restore
              id: P2_restore_grip
              pairs: [['{{object_a}}', '{{tool_link_a}}'], 
                      ['{{object_a}}', robot3_sa3_grpr01], 
                      ['{{object_b}}', '{{tool_link_b}}'], 
                      ['{{object_b}}', robot4_sa3_grpr01_r]]
        - op: move
          id: H1
          motion: moveJ
          strategy: combined
          group: '{{group}}'
          goals:
            - robot: '{{robot_a}}'
              named_state: home
            - robot: '{{robot_b}}'
              named_state: home
          enabled: '{{do_home}}'
    
    gantry_pick_transfer:
      defaults:
        gantry_pick_x: 0.0
        gantry_pick_z: 4.1
        gantry_transport_x: -6.0
        gantry_up_z: 0.0
        gantry_link: gantry_part_link
        rebar: rebar_1A
      steps:
        - op: gantry_send
          id: G1_home
          request_id: gantry_pick_g1
          x: '{{gantry_pick_x}}'
          z: '{{gantry_up_z}}'
          velocity: 1.45
          acceleration: 1.0
          wait: true
          timeout: 120
        - op: gantry_send
          id: G2_lower
          request_id: gantry_pick_g2
          x: '{{gantry_pick_x}}'
          z: '{{gantry_pick_z}}'
          velocity: 0.45
          acceleration: 0.5
          wait: true
          timeout: 120
        - op: attach
          id: G2_attach_rebar
          object: '{{rebar}}'
          link: '{{gantry_link}}'
          placement_mode: preserve_world
          touch_links:
            - '{{gantry_link}}'
        - op: gantry_send
          id: G3_raise
          request_id: gantry_pick_g3
          x: '{{gantry_pick_x}}'
          z: '{{gantry_up_z}}'
          velocity: 0.45
          acceleration: 0.5
          wait: true
          timeout: 120
        - op: gantry_send
          id: G4_transport
          request_id: gantry_pick_g4
          x: '{{gantry_transport_x}}'
          z: '{{gantry_up_z}}'
          velocity: 0.45
          acceleration: 0.5
          wait: true
          timeout: 120

    four_arm_home_shear_approach:
      defaults: {}
      steps:
        - op: move
          id: H1_plus_P1
          motion: moveJ
          strategy: combined
          group: sa3_all_robots
          goals:
            - robot: robot3
              named_state: home
            - robot: robot4
              named_state: home
            - robot: robot1
              target:
                reference: '{{shear_pick_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{shear_pick_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
  
    shear_pair:
      defaults:
        first_approach: true
        group: sa3_robots_1_2
        pick_a_offset: [0, 0, 0]
        pick_b_offset: [0, 0, 0]
        inventory_a: web_ring
        inventory_b: web_ring_2
      steps:
        - op: move
          id: P1
          motion: moveL
          strategy: separate_merge
          # Transit: LIN first; Pilz CIRC via-point second; OMPL joint last.
          circ_via_world_x: {robot1: 0.235, robot2: 5.22}
          fallbacks:
            - {motion: moveC, strategy: separate_merge}
            - {motion: moveJ, strategy: separate_merge}
          group: sa3_robots_1_2
          participants: &id001
            - robot1
            - robot2
          goals:
            - robot: robot1
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          enabled: '{{first_approach}}'
        - op: move
          id: P2
          motion: moveL
          strategy: separate_merge
          group: sa3_robots_1_2
          participants: *id001
          goals:
            - robot: robot1
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: '{{pick_a_offset}}'
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: '{{pick_b_offset}}'
                rpy: [0, 0, 0]
          before:
            - op: acm_allow
              id: P2_allow_gripper_contact
              pairs: [['{{object_a}}', robot1_tool_mount], 
                      ['{{object_a}}', robot1_schunk_base], 
                      ['{{object_b}}', robot2_tool_mount], 
                      ['{{object_b}}', robot2_schunk_base]]
          after:
            - op: attach
              id: P2_attach_a
              object: '{{object_a}}'
              link: robot1_tool_mount
              placement_mode: preserve_world
              touch_links: *id002
            - op: attach
              id: P2_attach_b
              object: '{{object_b}}'
              link: robot2_tool_mount
              placement_mode: preserve_world
              touch_links: *id003
            - op: acm_allow
              id: P2_allow_inventory_contact
              pairs: [['{{object_a}}', '{{inventory_a}}'], 
                      ['{{object_b}}', '{{inventory_b}}']]
        - op: move
          id: P3
          motion: moveL
          strategy: separate_merge
          group: sa3_robots_1_2
          participants: *id001
          goals:
            - robot: robot1
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          after:
            - op: acm_restore
              id: P3_restore_inventory_contact
              pairs: [['{{object_a}}', '{{inventory_a}}'], 
                      ['{{object_b}}', '{{inventory_b}}']]
        - op: move
          id: T1
          motion: moveL
          strategy: separate_merge
          # Transit: LIN first; Pilz CIRC via-point second; OMPL joint last.
          circ_via_world_x: {robot1: 0.235, robot2: 5.22}
          fallbacks:
            - {motion: moveC, strategy: separate_merge}
            - {motion: moveJ, strategy: separate_merge}
          group: sa3_robots_1_2
          participants: *id001
          goals:
            - robot: robot1
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
        - op: move
          id: G1
          motion: moveL
          strategy: separate_merge
          group: sa3_robots_1_2
          participants: *id001
          goals:
            - robot: robot1
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
          after:
            - op: detach
              id: G1_detach_a
              object: '{{object_a}}'
              link: robot1_tool_mount
            - op: detach
              id: G1_detach_b
              object: '{{object_b}}'
              link: robot2_tool_mount
            - op: acm_allow
              id: G1_reallow_gripper_contact_after_detach
              pairs: [['{{object_a}}', robot1_tool_mount], 
                      ['{{object_a}}', robot1_schunk_base], 
                      ['{{object_b}}', robot2_tool_mount], 
                      ['{{object_b}}', robot2_schunk_base]]
          before:
            - op: acm_allow
              id: G1_allow_jig_contact
              pairs: [['{{object_a}}', jig_clamp], ['{{object_b}}', jig_clamp]]
        - op: move
          id: G2
          motion: moveL
          strategy: separate_merge
          group: sa3_robots_1_2
          participants: *id001
          goals:
            - robot: robot1
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
            - robot: robot2
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          after:
            - op: acm_restore
              id: G2_restore_gripper_contact_after_retract
              pairs: [['{{object_a}}', robot1_tool_mount], 
                      ['{{object_a}}', robot1_schunk_base], 
                      ['{{object_b}}', robot2_tool_mount], 
                      ['{{object_b}}', robot2_schunk_base]]


            - op: acm_restore
              id: G2_restore_jig_contact
              pairs: [['{{object_a}}', jig_clamp], 
                      ['{{object_b}}', jig_clamp ]]
   
    bottom_mat_pp:
      defaults:
        rebar: rebar_1A
        gantry_link: gantry_part_link
        g4_x: -6.0
        g5_z: 1.2
        up_z: 0.0
      steps:
        - op: gantry_send
          id: G5_lower
          request_id: bmat_g5
          x: '{{g4_x}}'
          z: '{{g5_z}}'
          velocity: 2.45
          acceleration: 2.0
          wait: true
          timeout: 120
        - op: detach
          id: G5_release
          object: '{{rebar}}'
          link: '{{gantry_link}}'
        - op: move
          id: R1
          motion: moveJ
          strategy: separate_merge
          group: robot3_robot4_arms
          participants: &id004
            - robot3
            - robot4
          goals:
            - robot: robot3
              link: robot3_end_effactor_ff
              target:
                reference: '{{pick_a}}'
                offset_frame: local
                xyz: [-0.05, 0, 0]
                rpy: [0, 0, 0]
            - robot: robot4
              link: robot4_end_effactor_ff
              target:
                reference: '{{pick_b}}'
                offset_frame: local
                xyz: [-0.05, 0, 0]
                rpy: [0, 0, 0]
        - op: move
          id: R2
          motion: moveL
          strategy: separate_merge
          group: robot3_robot4_arms
          participants: *id004
          goals:
            - robot: robot3
              link: robot3_end_effactor_ff
              target:
                reference: '{{pick_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: robot4
              link: robot4_end_effactor_ff
              target:
                reference: '{{pick_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
          before:
            - op: acm_allow
              id: R2_allow_grasp
              pairs: [['{{rebar}}', robot3_end_effactor_ff]]
          after:
            - op: attach
              id: R2_robot3_attach
              object: '{{rebar}}'
              link: robot3_end_effactor_ff
              placement_mode: preserve_world
              touch_links: *id005
            - op: acm_restore
              id: R2_restore_grasp
              pairs: [['{{rebar}}', robot3_end_effactor_ff]]
        - op: move
          id: R3
          motion: moveL
          strategy: coordinated_cartesian
          group: robot3_robot4_arms
          goals:
            - robot: robot3
              link: robot3_end_effactor_ff
              target:
                reference: '{{pick_a}}'
                offset_frame: local
                xyz: [-0.05, 0, 0]
                rpy: [0, 0, 0]
            - robot: robot4
              link: robot4_end_effactor_ff
              target:
                reference: '{{pick_b}}'
                offset_frame: local
                xyz: [-0.05, 0, 0]
                rpy: [0, 0, 0]
        - op: gantry_send
          id: G6_retract
          request_id: bmat_g6
          x: '{{g4_x}}'
          z: '{{up_z}}'
          velocity: 0.45
          acceleration: 0.5
          wait: false
          timeout: 120
        - op: gantry_wait
          id: G6_wait
          request_id: bmat_g6
          timeout: 180
        - op: move
          id: R4
          motion: moveJ
          strategy: separate_merge
          group: robot3_robot4_arms
          participants: *id004
          goals:
            - robot: robot3
              link: robot3_end_effactor_ff
              target:
                reference: '{{place_a}}'
                offset_frame: local
                xyz: [-0.1, 0, 0]
                rpy: [0, 0, 0]
            - robot: robot4
              link: robot4_end_effactor_ff
              target:
                reference: '{{place_b}}'
                offset_frame: local
                xyz: [-0.1, 0, 0]
                rpy: [0, 0, 0]
        - op: move
          id: R5
          motion: moveL
          strategy: coordinated_cartesian
          group: robot3_robot4_arms
          goals:
            - robot: robot3
              link: robot3_end_effactor_ff
              target:
                reference: '{{place_a}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
            - robot: robot4
              link: robot4_end_effactor_ff
              target:
                reference: '{{place_b}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
          after:
            - op: detach
              id: R5_robot3_detach
              object: '{{rebar}}'
              link: robot3_end_effactor_ff
        - op: move
          id: R6
          motion: moveL
          strategy: coordinated_cartesian
          group: robot3_robot4_arms
          goals:
            - robot: robot3
              link: robot3_end_effactor_ff
              target:
                reference: '{{place_a}}'
