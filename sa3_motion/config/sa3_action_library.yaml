                - ['{{object}}', robot1_tool_mount]
                - ['{{object}}', robot1_schunk_base]
          after:
            - op: attach
              id: P2_attach
              object: '{{object}}'
              link: robot1_tool_mount
              placement_mode: preserve_world
              touch_links:
                - robot1_tool_mount
                - robot1_J4_link
                - robot1_J5_link
                - robot1_J6_link

            - op: acm_allow
              id: P2_allow_inventory_contact
              pairs:
                - ['{{object}}', '{{inventory}}']

        # P3 - Pick retract
        - op: move
          id: P3
          motion: moveL
          strategy: separate_merge
          group: robot1_arm
          participants: [robot1]
          goals:
            - robot: robot1
              link: robot1_tool_mount
              target:
                reference: '{{pick}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          after:
            - op: acm_restore
              id: P3_restore_inventory_contact
              pairs:
                - ['{{object}}', '{{inventory}}']

        # T1 - Place approach
        - op: move
          id: T1
          motion: moveL
          strategy: separate_merge
          circ_via_world_x: {robot1: 0.235}
          fallbacks:
            - {motion: moveC, strategy: separate_merge}
            - {motion: moveJ, strategy: separate_merge}
          group: robot1_arm
          participants: [robot1]
          goals:
            - robot: robot1
              link: robot1_tool_mount
              target:
                reference: '{{place}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]

        # G1 - Place rebar
        - op: move
          id: G1
          motion: moveL
          strategy: separate_merge
          group: robot1_arm
          participants: [robot1]
          goals:
            - robot: robot1
              link: robot1_tool_mount
              target:
                reference: '{{place}}'
                offset_frame: world
                xyz: [0, 0, 0]
                rpy: [0, 0, 0]
          before:
            - op: acm_allow
              id: G1_allow_jig_contact
              pairs:
                - ['{{object}}', jig_clamp]
          after:
            - op: detach
              id: G1_detach
              object: '{{object}}'
              link: robot1_tool_mount

            - op: acm_allow
              id: G1_reallow_gripper_contact_after_detach
              pairs:
                - ['{{object}}', robot1_tool_mount]
                - ['{{object}}', robot1_schunk_base]

        # G2 - Place retract
        - op: move
          id: G2
          motion: moveL
          strategy: separate_merge
          group: robot1_arm
          participants: [robot1]
          goals:
            - robot: robot1
              link: robot1_tool_mount
              target:
                reference: '{{place}}'
                offset_frame: world
                xyz: [0, -0.25, 0]
                rpy: [0, 0, 0]
          after:
            - op: acm_restore
              id: G2_restore_gripper_contact_after_retract
              pairs:
                - ['{{object}}', robot1_tool_mount]
                - ['{{object}}', robot1_schunk_base]

            - op: acm_restore
              id: G2_restore_jig_contact
              pairs:
                - ['{{object}}', jig_clamp]

