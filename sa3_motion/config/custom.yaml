
# Motion sequence configuration for sa3_motion_sequence.launch.py
# mode: parallel | sequential
# on_failure: abort | continue | final_home | finish
# retries is the total number of attempts, including the first attempt.

motion_sequence:
  stages:
  
    - name: "Pick/place Half web flanges"
      executables:
        - name: flange_pp
        - name: attach_tool
      mode: parallel
      retries: 1
      on_failure: abort


    - name: "Pick/place web rings & shear clamps"
      executables:
        - name: shear_links_pp
          parameters:
            # format: pick_frame,place_frame,rebar_id,pick_offset_x,pick_offset_y,pick_offset_z
            robot1_pick_place_pairs:
              # - "5pf,5_placef_l,rebar_5a,0.0,0.0,0.0"
              # - "13pf,13_placef1_l,rebar_13_1,0.0,0.0,0.0"
              # - "13pf,13_placef2_l,rebar_13_2,0.10,0.0,0.0"
              # - "13pf,13_placef3_l,rebar_13_3,0.20,0.0,0.0"
              # - "13pf,13_placef4_l,rebar_13_4,0.30,0.0,0.0"
              # - "14pf,14_placef1_l,rebar_14_1,0.0,0.0,0.0"
              - "14pf,14_placef2_l,rebar_14_2,0.20,0.0,0.0"
              - "14pf,14_placef3_l,rebar_14_3,0.40,0.0,0.0"
              - "14pf,14_placef4_l,rebar_14_4,0.60,0.0,0.0"
            robot2_pick_place_pairs:
              - "6pf,6_placef_r,rebar_6,0.0,0.0,0.0"
              - "13_1pf,13_placef1_r,rebar_13_1_R,0.0,0.0,0.0"
              # - "13_1pf,13_placef2_r,rebar_13_2_R,0.118,0.0,0.0"
              # - "13_2pf,13_placef3_r,rebar_13_3_R,0.0,0.0,0.0"
              # - "14_4pf,14_placef4_r,rebar_14_1_R,0.0,0.0,0.0"
              # - "14_4pf,14_placef3_r,rebar_14_2_R,0.112,0.0,0.0"
              # - "14_4pf,14_placef2_r,rebar_14_3_R,0.224,0.0,0.0"
              # - "14_4pf,14_placef1_r,rebar_14_4_R,0.336,0.0,0.0"

            robot1_via_x: 0.235   # world X of the CIRC via point (default 0.235)
            robot2_via_x: 5.22    # (default 5.22)
      mode: parallel
      retries: 1
      on_failure: abort

    - name: "Change gripper"
      executables:
        - robot1_gripper_change
      mode: sequential
      retries: 3
      on_failure: continue

    - name: "tying rebars with tying guns"
      executables:
      - name: tying_rebars
        parameters:
          robot1_clamp_frames: ["5_placef_l", "13_placef1_l"]
          robot1_tie_counts: [3, 2]
          robot2_clamp_frames: ["6_placef_r"]
          robot2_tie_counts: [3]
          stop_on_first_failure: false   # default
          robot1_enabled: true           # default
          robot2_enabled: true           # default

      mode: parallel
      retries: 1
      on_failure: abort
